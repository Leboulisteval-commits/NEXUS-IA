.tb{overflow-x:auto;margin:6px 0}.tb table{border-collapse:collapse;font-size:13px}.tb th,.tb td{border:1px solid rgba(120,90,220,.25);padding:4px 8px;text-align:left}.tb th{background:rgba(120,90,220,.10)}
.bq{display:block;border-left:3px solid #c9bdf5;padding-left:8px;color:#6b5aa8}.bb hr{border:0;border-top:1px solid rgba(120,90,220,.25);margin:8px 0}
.gimg{max-width:100%;border-radius:12px;display:block;margin-top:8px}
.card .cbtn{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.card button,.clist button{border:1px solid rgba(120,90,220,.25);background:#fff;color:#5b4a8a;border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer;touch-action:manipulation}.card .cbtn button:first-child{background:linear-gradient(135deg,#8b5cff,var(--brand2));color:#fff;border:0}

:root{--tx:#2b2340;--dm:#8a7fb0;--er:#e0445a;--brand:#7c5cff;--brand2:#c86bff;--bg1:#e6e2ff;--bg2:#f0efff;--bg3:#d9e8ff;--soft:#f8f6ff;--line:rgba(120,90,220,.12)}
#bar{bottom:calc(env(safe-area-inset-bottom) + 6px)}
#nw,#sb{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,rgba(139,92,255,.16),rgba(200,107,255,.16));border:1px solid rgba(139,92,255,.18);color:var(--brand);box-shadow:0 8px 24px rgba(60,30,140,.18);display:flex;align-items:center;justify-content:center;padding:0;font-size:0;cursor:pointer;touch-action:manipulation}

.ath{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--dm)}

.ath .fi{width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px}

#lb{position:fixed;inset:0;z-index:999;background:rgba(10,8,25,.94);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
#lb[hidden]{display:none}

#lb button{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px}
.mt .who{display:inline-flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.04em;color:var(--dm)}

/* ===== v1.1 ===== */
#app{top:0;left:0;right:0;bottom:auto;height:100%}

#msgs{padding-bottom:calc(205px + env(safe-area-inset-bottom));-webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 84px,#000 150px,#000 calc(100% - 200px - env(safe-area-inset-bottom)),transparent calc(100% - 84px - env(safe-area-inset-bottom)),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,transparent 84px,#000 150px,#000 calc(100% - 200px - env(safe-area-inset-bottom)),transparent calc(100% - 84px - env(safe-area-inset-bottom)),transparent 100%)}

/* avatar de fond : un seul, grand, qui flotte et fait coucou / clin d'oeil. Les messages passent par-dessus. */
#bgav{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 96px);z-index:0;pointer-events:none;display:flex;justify-content:center;transition:opacity .7s,top .7s,transform .7s}

.wink::after{content:'';position:absolute;left:6%;right:6%;top:46%;height:3px;border-radius:3px;background:#c4e8ff;box-shadow:0 0 7px #8fd0ff}
.avw.doWink .wink{animation:wk .9s ease-in-out}
@keyframes wk{0%,100%{opacity:0;transform:scaleY(.1)}20%,80%{opacity:1;transform:scaleY(1)}}
.avw.doWave /* accueil : l'avatar propose, les messages sont ses bulles */

.sugs{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;transition:opacity .35s}
.sugs.out{opacity:0}
.sug{width:auto;max-width:92%;padding:11px 16px;border-radius:22px 22px 22px 8px;border:1px solid rgba(120,90,220,.16);background:rgba(255,255,255,.92);color:#5b4a8a;font-size:14.5px;text-align:left;box-shadow:0 6px 18px rgba(90,60,200,.12);animation:pop .55s both}
.sug:nth-child(1){animation-delay:.25s}.sug:nth-child(2){animation-delay:.45s}.sug:nth-child(3){animation-delay:.65s}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){#bgav .avw,.avw.doWave,.sug.fl,.spk,.sug{animation:none}}
.mt{flex-wrap:wrap;row-gap:4px}.mt .who{flex-basis:100%;margin-bottom:2px}

.wel{padding-top:calc(246px)}
.sug{font-size:15.5px;padding:13px 20px}

<div id="app">
<header>
  <button data-v="hist" title="Historique"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
  <div class="head-center on" data-v="chat" title="Retour au chat">
    <img src="logo.png" class="logo" alt="NEXUS">
    <div class="head-text"><div class="head-title">NEXUS AI</div><div class="head-sub" id="stt">4 IA prêtes</div></div>
  </div>
  <button data-v="set" title="Réglages"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
</header>
<div id="bgav" class="home"><div class="avw"><img src="avatar.png" alt=""><i class="wink"></i></div></div>
<main>
<section class="v on" id="v-chat"><div id="msgs"><div style="text-align:center;color:var(--dm);padding:40px 10px"><h2 style="color:var(--tx)">NEXUS AI</h2>Je réponds seul aux demandes simples et je ne sollicite une IA que si c'est nécessaire.<br>Tapez <b>aide</b> pour voir ce que je sais faire.<div class="sugs"><button class="sug" data-q="Quelle heure est-il à Tokyo ?">🕐 Quelle heure est-il à Tokyo ?</button><button class="sug" data-q="Dans 3 semaines">📅 Dans 3 semaines</button><button class="sug" data-q="Explique-moi ce qu'est une étoile simplement">🧠 Explique-moi ce qu'est une étoile simplement</button></div></div></div></section>
<section class="v" id="v-hist"><button class="b2 on" data-v="chat" style="margin-bottom:10px">← Retour au chat</button><input id="q" placeholder="Rechercher dans l'historique…"><div id="hl"></div><div id="stock"></div></section>
<section class="v" id="v-set"></section>
<section class="v" id="v-guide"></section>
</main>
<div id="bar" style="display: flex;"><button id="nw" title="Nouvelle conversation" aria-label="Nouvelle conversation"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button><div id="inwrap"><div id="fchip"><img id="fth" alt=""><span id="fname"></span><button id="focr" title="Lire le texte de l'image (gratuit)">Aa</button><button id="fx" title="Retirer le fichier">✕</button></div><div id="inrow"><textarea id="in" rows="1" placeholder="Message à NEXUS…" enterkeyhint="send"></textarea><button id="mic" title="Parler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg></button><button id="att" title="Joindre un fichier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button></div></div><button id="sb" aria-label="Envoyer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7z"></path></svg></button></div><input type="file" id="attfile" style="display:none">
</div>
<div id="sa" style="position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none"></div>
<button id="pbadge" type="button" style="display:none">🔌 Connecter Puter</button>
<div id="fr" hidden></div>
<div id="lb" hidden><img alt=""><button type="button" aria-label="Fermer">✕</button></div>
<div id="ts"></div>
<div id="dlmenu" style="display:none"><div id="dlbox"></div></div>
<script async="" src="https://js.puter.com/v2/"></script>
<script type="module" src="app.js"></script>
</body>
</html>

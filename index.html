async function route(t){
  const kw = intent(t);
  let isExplicit = false;
  const n = norm(t);
  for(const k in KW){ if(KW[k].some(w => n.startsWith(w) || n.includes(' '+w+' '))) { isExplicit = true; break; } }
  
  if(rt==='on' && NB && NB.analyzeIntentDetailed){
    try{
      const r = await NB.analyzeIntentDetailed(t);
      if(r && r.intent){
        let mappedIntent = r.intent;
        if(mappedIntent === 'math') mappedIntent = 'general';
        
        const score = r.score || 0;
        const margin = r.margin || 0;
        
        if(isExplicit && score < 0.52) {
          L('route',{src:'mots-clés (explicite)',it:kw,score:+score.toFixed(3)});
          return kw;
        }
        if(score >= 0.35 && margin >= 0.04) {
          L('route',{src:'sens',it:mappedIntent,score:+score.toFixed(3),margin:+margin.toFixed(3)});
          return mappedIntent;
        }
        if(!isExplicit && (score < 0.35 || margin < 0.04)) {
          L('route',{src:'incertain → general',it:'general',score:+score.toFixed(3)});
          return 'general';
        }
        L('route',{src:'sens (fallback)',it:mappedIntent,score:+score.toFixed(3)});
        return mappedIntent;
      }
    } catch(e){ L('route',{src:'mots-clés (erreur)',msg:String(e&&e.message||e).slice(0,100)}) }
  }
  L('route',{src:'secours mots-clés',it:kw});
  return kw;
}

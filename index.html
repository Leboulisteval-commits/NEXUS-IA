const $=s=>document.querySelector(s),V='3.2';

function intent(t){const n=norm(t);for(const k in KW)if(KW[k].some(w=>new RegExp('(^|[^a-z])'+w).test(n)))return k;return t.length>500?'long':'general'}
function order(it,simple){const o=simple?['pollinations','kilo','puter',...PREF[it]]:[...PREF[it],'puter','pollinations','kilo'];return[...new Set(o)].filter(avail)}
/* ---------- appels IA ---------- */
async function ft(url,o){ac=new AbortController();let to=0;const t=setTimeout(()=>{to=1;ac.abort()},25000);try{return await fetch(url,{...o,signal:ac.signal})}catch(e){throw Object.assign(new Error(to?'Délai dépassé (25 s)':ac.signal.aborted?'Annulé':e.message),{status:to?408:0,abort:!to&&ac.signal.aborted})}finally{clearTimeout(t)}}
async function oa(url,key,model,msgs,mx,x){const r=await ft(url,{method:'POST',headers:{'Content-Type':'application/json',...(key?{Authorization:'Bearer '+key}:{}),...(x||{})},body:JSON.stringify({model,messages:msgs,temperature:.7,max_tokens:mx})});if(!r.ok)throw Object.assign(new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160)),{status:r.status});const d=await r.json();return d.choices?.[0]?.message?.content||''}
const CALL={
groq:(m,x)=>oa('https://api.groq.com/openai/v1/chat/completions',st.keys.groq,'openai/gpt-oss-120b',m,x),
openrouter:(m,x)=>oa('https://openrouter.ai/api/v1/chat/completions',st.keys.openrouter,'openrouter/free',m,x,{'X-Title':'NEXUS AI'}),
kilo:(m,x)=>oa('https://api.kilo.ai/api/gateway/chat/completions',st.keys.kilo||'','kilo-auto/free',m,x),
pollinations:(m,x)=>oa('https://text.pollinations.ai/openai','','openai-fast',m,x),
async gemini(m,mx){const sy=m.find(x=>x.role==='system'),b={contents:m.filter(x=>x.role!=='system').map(x=>({role:x.role==='assistant'?'model':'user',parts:[{text:x.content}]})),generationConfig:{temperature:.7,maxOutputTokens:mx}};if(sy)b.systemInstruction={parts:[{text:sy.content}]};const r=await ft('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key='+encodeURIComponent(st.keys.gemini),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Object.assign(new Error('HTTP '+r.status+' '+(await r.text()).slice(0,160)),{status:r.status});const d=await r.json();return(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')},
async puter(m){if(typeof puter==='undefined')throw Object.assign(new Error('SDK Puter non chargé'),{status:0});try{const r=await puter.ai.chat(m);return typeof r==='string'?r:(typeof r?.message?.content==='string'?r.message.content:r?.message?.content?.[0]?.text)||r?.text||''}catch(e){const s=(e&&e.message)||JSON.stringify(e);throw Object.assign(new Error('Puter: '+String(s).slice(0,160)),{status:/insufficient|402/i.test(JSON.stringify(e)+s)?402:0})}}};
async function run(id,msgs,mx){const t0=Date.now();count(id);try{const o=await CALL[id](msgs,mx);if(!o||!o.trim())throw Object.assign(new Error('Réponse vide'),{status:0});const ms=Date.now()-t0;L('try',{p:id,ok:1,ms});return{o,ms}}catch(e){const s=e.status;L('try',{p:id,ok:0,status:s,err:e.message.slice(0,200),ms:Date.now()-t0});if(s===402){const d=new Date();d.setMonth(d.getMonth()+1,1);d.setHours(0,0,0,0);st.pause[id]=+d}else if(s===429)st.pause[id]=Date.now()+6e5;else if([401,403,404].includes(s))st.pause[id]=Date.now()+18e5;if(s)S.s('pause',st.pause);throw e}}
/* ---------- fonctions locales ---------- */
const U={km:['l',1000],m:['l',1],cm:['l',.01],mm:['l',.001],mi:['l',1609.344],miles:['l',1609.344],ft:['l',.3048],pieds:['l',.3048],kg:['m',1],g:['m',.001],lb:['m',.45359237],livres:['m',.45359237],l:['v',1],ml:['v',.001],gal:['v',3.785411784],c:['t'],celsius:['t'],f:['t'],fahrenheit:['t'],kmh:['s',1],mph:['s',1.609344]};
const CITY={paris:'Europe/Paris',londres:'Europe/London',berlin:'Europe/Berlin',madrid:'Europe/Madrid',rome:'Europe/Rome',moscou:'Europe/Moscow',istanbul:'Europe/Istanbul',casablanca:'Africa/Casablanca',alger:'Africa/Algiers',tunis:'Africa/Tunis',dakar:'Africa/Dakar',abidjan:'Africa/Abidjan',lagos:'Africa/Lagos',"le caire":'Africa/Cairo',dubai:'Asia/Dubai',tokyo:'Asia/Tokyo',pekin:'Asia/Shanghai',shanghai:'Asia/Shanghai',seoul:'Asia/Seoul',bangkok:'Asia/Bangkok',delhi:'Asia/Kolkata',sydney:'Australia/Sydney',"new york":'America/New_York',montreal:'America/Toronto',chicago:'America/Chicago',"los angeles":'America/Los_Angeles',"sao paulo":'America/Sao_Paulo',"mexico":'America/Mexico_City'};
const CUR=x=>/^euro/.test(x)?'EUR':/^dollar/.test(x)?'USD':x.toUpperCase();
const wc=c=>c===0?'ciel dégagé':c<4?'nuageux':c<50?'brouillard':c<60?'bruine':c<70?'pluie':c<80?'neige':c<85?'averses':c<95?'averses de neige':'orage';
const fd=d=>d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

async function local(raw){const n=norm(raw),now=new Date();let m;
if(m=n.match(/^(bonjour|salut|hello|coucou|bonsoir|hey|cc)( nexus)?\s*[!.?]*$/))return(now.getHours()<18?'Bonjour':'Bonsoir')+' ! Je suis NEXUS 👋 Posez-moi une question ou tapez **aide**.';
if(/^(merci|merci beaucoup|thanks)( nexus)?\s*[!.]*$/.test(n))return'Avec plaisir ! 😊';
if(/^(qui es[- ]tu|tu es qui|presente[- ]toi)\??$/.test(n))return'Je suis **NEXUS**, un assistant qui répond seul aux demandes simples et choisit une IA gratuite quand c\'est nécessaire, pour économiser les crédits.';
if(/^(aide|help|commandes|que (sais|peux)[- ]tu faire)\??$/.test(n))return'**En local (0 crédit)** : calculs, pourcentages, conversions (`10 km en mi`, `20 c en f`), devises (`100 eur en usd`), dates (`dans 3 semaines`, `quel jour etait le 14/07/1789`, `combien de jours avant le 25/12/2026`), heure (`quelle heure est-il a Tokyo`), météo (`meteo Lyon`), Wikipédia (`qui est Marie Curie`), dés, pile ou face, tirage (`choisis entre a, b ou c`), mot de passe, `compte mots : texte`.\n**Forcer une IA** : `/groq`, `/gemini`, `/openrouter`, `/kilo`, `/puter`, `/pollinations` + votre question.';
if(/^(quelle heure est[- ]il|il est quelle heure)\??$/.test(n))return'Il est **'+now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'** ('+fd(now)+').';
if(m=n.match(/^(?:quelle heure est[- ]il|il est quelle heure) (?:a|au|en) (.+?)\??$/)){const z=CITY[m[1]];if(z)return'À **'+m[1]+'** il est **'+now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:z})+'** ('+now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:z})+').'}
if(/^(quel jour (sommes|est)[- ]nous|on est quel jour|quelle est la date( d aujourd hui)?|date d aujourd hui|quelle date sommes[- ]nous)\??$/.test(n))return'Nous sommes le **'+fd(now)+'**.';
if(m=n.match(/^dans (\d+) (jours?|semaines?|mois|ans?)\??$/)){const d=new Date(),k=+m[1];/^jour/.test(m[2])?d.setDate(d.getDate()+k):/^sem/.test(m[2])?d.setDate(d.getDate()+7*k):m[2]==='mois'?d.setMonth(d.getMonth()+k):d.setFullYear(d.getFullYear()+k);return'📅 Dans '+m[1]+' '+m[2]+', nous serons le **'+fd(d)+'**.'}
if(m=n.match(/^quel jour (?:etait|est|sera) le (\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})\??$/)){const d=new Date(+m[3],m[2]-1,+m[1]);if(d.getMonth()==m[2]-1)return'Le '+m[1]+'/'+m[2]+'/'+m[3]+' : **'+fd(d)+'**.'}
if(m=n.match(/^combien de jours (?:avant|jusqu a|jusqu au) (?:le )?(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})\??$/)){const d=new Date(+m[3],m[2]-1,+m[1]),t=new Date();t.setHours(0,0,0,0);const k=Math.round((d-t)/864e5);return k>=0?'⏳ Il reste **'+k+' jour(s)** jusqu\'au '+fd(d)+'.':'Cette date est passée il y a **'+(-k)+' jour(s)**.'}
if(/^(pile ou face|lance une piece)\??$/.test(n))return'🪙 **'+(Math.random()<.5?'Pile':'Face')+'** !';
if(m=n.match(/^(?:lance|jette|roule) (?:un )?des? ?(?:a )?(\d+)? ?(?:faces)?\??$/)){const f=Math.max(2,+m[1]||6);return'🎲 Dé à '+f+' faces : **'+(1+Math.floor(Math.random()*f))+'**'}
if(/^(choisis|tire au sort)\b/.test(n)&&(m=raw.match(/^\S+(?:\s+au\s+sort)?\s+(?:entre\s+)?([\s\S]+?)\s*\??$/i))){const it=m[1].split(/\s*(?:,|\bou\b)\s*/).filter(Boolean);if(it.length>1)return'🎯 Je choisis : **'+it[Math.floor(Math.random()*it.length)]+'**'}
if(m=n.match(/^(?:genere|cree|creer|donne)(?:[- ]moi)? un (?:mot de passe|mdp)(?: de (\d+) caracteres)?\??$/)){const L2=Math.min(64,Math.max(8,+m[1]||16)),cs='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&*';let p='';for(const v of crypto.getRandomValues(new Uint32Array(L2)))p+=cs[v%cs.length];return'🔐 Mot de passe de '+L2+' caractères :\n\n`'+p+'`'}
if(m=raw.match(/^(?:compte|nombre de|combien de)\s+(mots|caract[eè]res)\s*(?:dans)?\s*[:\-]\s*([\s\S]+)$/i)){const t=m[2].trim();return'✍️ **'+(/^mot/i.test(m[1])?t.split(/\s+/).length+' mots**':t.length+' caractères**')}
if(m=n.match(/^(\d+(?:[.,]\d+)?)\s*%\s*de\s*(\d+(?:[.,]\d+)?)\??$/))return'**'+m[1]+' % de '+m[2]+' = '+fx(num(m[1])*num(m[2])/100)+'**';
if(/^[\d\s+\-*/().,^%x×÷]+$/.test(n)&&/\d/.test(n)&&/[+\-*/^x×÷]/.test(n)&&!/^\d{4}-\d{2}-\d{2}$/.test(n)){const e=n.replace(/,/g,'.').replace(/[x×]/g,'*').replace(/÷/g,'/').replace(/\^/g,'**').replace(/%/g,'/100');if(/^[\d\s+\-*/().]+$/.test(e))try{const v=Function('"use strict";return('+e+')')();if(typeof v==='number'&&isFinite(v))return'**'+raw.trim()+' = '+fx(v)+'**'}catch{}}
if(m=n.match(/^(\d+(?:[.,]\d+)?)\s*(eur|euros?|usd|dollars?|gbp|chf|cad|jpy|mad|dzd|tnd)\s+(?:en|to|vers)\s+(eur|euros?|usd|dollars?|gbp|chf|cad|jpy|mad|dzd|tnd)\??$/)){const a=CUR(m[2]),b=CUR(m[3]),x=num(m[1]);try{let r;try{r=(await J('https://open.er-api.com/v6/latest/'+a)).rates[b]}catch{r=(await J('https://api.frankfurter.app/latest?from='+a+'&to='+b)).rates[b]}if(r)return'💱 **'+x+' '+a+' = '+fx(x*r)+' '+b+'** (taux du jour, mis à jour une fois par jour)'}catch{}return null}
if(m=n.replace(/km\/h/g,'kmh').match(/^(-?\d+(?:[.,]\d+)?)\s*([a-z]+)\s+(?:en|to|vers)\s+([a-z]+)\??$/)){const A=U[m[2]],B=U[m[3]],x=num(m[1]);if(A&&B&&A[0]===B[0]){let r;if(A[0]==='t'){const f=/^f/.test(m[2]),g=/^f/.test(m[3]);r=f===g?x:f?(x-32)*5/9:x*9/5+32}else r=x*A[1]/B[1];return'📏 **'+x+' '+m[2]+' = '+fx(r)+' '+m[3]+'**'}}
if(m=n.match(/^(?:meteo|quel temps(?: fait[- ]il)?)\s*(?:a|au|aux|en|de|pour|sur)?\s*([a-z -]{2,40}?)\??$/)){try{const g=(await J('https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name='+encodeURIComponent(m[1]))).results?.[0];if(!g)return null;const w=await J('https://api.open-meteo.com/v1/forecast?latitude='+g.latitude+'&longitude='+g.longitude+'&current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1'),c=w.current,d=w.daily;return'🌤️ **'+g.name+'** ('+(g.country||'')+') : '+wc(c.weather_code)+', **'+Math.round(c.temperature_2m)+' °C** (ressenti '+Math.round(c.apparent_temperature)+' °C), vent '+Math.round(c.wind_speed_10m)+' km/h.\nAujourd\'hui : '+Math.round(d.temperature_2m_min[0])+' à '+Math.round(d.temperature_2m_max[0])+' °C, pluie '+(d.precipitation_probability_max[0]??'?')+' %.\nDonnées : [Open-Meteo.com](https://open-meteo.com/)'}catch{return null}}
if(m=n.match(/^(?:qui (?:est|etait)|qu est[- ]ce qu(?:e|un|une)|c est quoi)\s+(.{2,40}?)\??$/)){const q=m[1].replace(/^(le|la|les|l|un|une|des) /,'');if(q.split(' ').length<=4)try{const r=await J('https://fr.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=1&gsrsearch='+encodeURIComponent(q)+'&prop=extracts&exintro=1&explaintext=1&exsentences=3&format=json&origin=*'),p=Object.values(r.query?.pages||{})[0];if(p&&p.extract&&q.split(' ').every(w=>norm(p.title).includes(w)))return'📖 **'+p.title+'** — '+p.extract+'\n\nSource : [Wikipédia](https://fr.wikipedia.org/?curid='+p.pageid+') (vérifiez que c\'est bien le sujet voulu)'}catch{}return null}
return null}
/* ---------- conversations ---------- */
const cur0=()=>st.convs.find(c=>c.id===st.cur),save=()=>{st.convs=st.convs.slice(-50);S.s('convs',st.convs);S.s('cur',st.cur)};
function cur(){let c=cur0();if(!c){c={id:Date.now(),t:'',d:Date.now(),m:[]};st.convs.push(c);st.cur=c.id}return c}
function md(t){const sp=[],k=h=>{sp.push(h);return'\u0001'+(sp.length-1)+'\u0001'};let h=String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
h=h.replace(/```\w*\n?([\s\S]*?)```/g,(m,c)=>k('<pre><code>'+c.replace(/\n$/,'')+'</code></pre>')).replace(/`([^`\n]+)`/g,(m,c)=>k('<code>'+c+'</code>'));
h=h.replace(/^#{1,6}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*]\s+/gm,'• ').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)"\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');

function render(){const c=cur0(),e=$('#msgs');if(!c||!c.m.length){e.innerHTML='<div style="text-align:center;color:var(--dm);padding:40px 10px"><h2 style="color:var(--tx)">NEXUS AI</h2>Je réponds seul aux demandes simples et je ne sollicite une IA que si c\'est nécessaire.<br>Tapez <b>aide</b> pour voir ce que je sais faire.</div>';return}
e.innerHTML=c.m.map((m,i)=>m.r==='user'?`<div class="m user"><div class="bb">${esc(m.c)}</div></div>`:`<div class="m ai"><div class="bb">${md(m.c)}</div><div class="mt"><span>${P[m.p]?P[m.p].i+' '+P[m.p].n:'🧠 Nexus local'}${m.why?' · '+esc(m.why):''}${m.ms?' · '+(m.ms/1000).toFixed(1)+' s':''}</span><button data-a="cp" data-i="${i}">📋</button><button data-a="bd" data-i="${i}" style="${m.bad?'color:var(--er)':''}">👎</button></div></div>`).join('')+(st.busy?'<div class="m ai"><div class="bb">…</div></div>':'');e.scrollTop=e.scrollHeight}
function say(c,o){c.m.push({r:'ai',...o});save();render()}
async function send(t0){if(st.busy){if(ac)ac.abort();st.stop=1;return}
const raw=(t0??$('#in').value).trim();if(!raw)return;$('#in').value='';$('#in').style.height='auto';
const c=cur();c.m.push({r:'user',c:raw});if(!c.t)c.t=raw.slice(0,40);save();st.busy=1;st.stop=0;$('#sb').textContent='■';render();
try{let text=raw,forced=null,fm=raw.match(/^\/(groq|gemini|openrouter|kilo|puter|pollinations)\s+([\s\S]+)/i);if(fm){forced=fm[1].toLowerCase();text=fm[2].trim()}
if(!forced){const l=await local(raw);if(l){L('req',{via:'local',q:raw.slice(0,200)});say(c,{p:'local',c:l,why:'local, 0 crédit'});return}}
const it=intent(text),simple=it==='general'&&text.length<150&&c.m.length<4;let ord;
if(forced){ord=(P[forced].k&&!st.keys[forced])?[]:(forced==='puter'&&!signed())?[]:[forced];if(!ord.length){say(c,{p:'local',err:1,c:'⚠️ **'+P[forced].n+'** n\'est pas configuré (clé manquante ou non connecté). Voir ⚙️ Réglages.'});return}}else ord=order(it,simple);
L('req',{it,simple,ord,forced,q:raw.slice(0,300)});
if(!ord.length){say(c,{p:'local',err:1,c:navigator.onLine?'⚠️ Aucune IA disponible (désactivées, sans clé, en pause ou quota atteint). Voir ⚙️ Réglages.':'📴 Hors connexion : seules les fonctions locales marchent.'});return}
const ck=norm(text),first=c.m.length===1&&!forced;if(first&&st.cache[ck]){say(c,{p:st.cache[ck].p,c:st.cache[ck].c,why:'réponse mémorisée, 0 crédit'});return}
const h=[];for(let i=0;i<c.m.length-1;i++){const a=c.m[i],b=c.m[i+1];if(a.r==='user'&&(b.p==='local'||b.err))i++;else if(a.p!=='local'&&!a.err)h.push({role:a.r==='user'?'user':'assistant',content:a.c})}
const sys='Tu es NEXUS, un assistant utile, précis et concis. Réponds en français par défaut. Date et heure actuelles : '+new Date().toLocaleString('fr-FR',{dateStyle:'full',timeStyle:'short'})+' (fuseau '+Intl.DateTimeFormat().resolvedOptions().timeZone+').';

say(c,{p:'local',err:1,c:'❌ Aucune IA n\'a pu répondre : '+fail.join(', ')+'. Le détail est dans le journal (⚙️ Réglages).'})
}catch(e){L('send_error',{msg:e.message});say(c,{p:'local',err:1,c:'❌ Erreur : '+e.message})}finally{st.busy=0;$('#sb').textContent='➤';render();upd()}}
/* ---------- historique ---------- */
function rhist(){const q=norm($('#q').value||''),l=[...st.convs].reverse().filter(c=>!q||norm(c.t+' '+c.m.map(m=>m.c).join(' ')).includes(q));$('#hl').innerHTML=l.length?l.map(c=>`<div class="hi" data-o="${c.id}"><div><b>${esc(c.t||'(vide)')}</b><br><small>${new Date(c.d).toLocaleString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})} · ${c.m.length} messages</small></div><button class="ib" data-del="${c.id}">🗑</button></div>`).join(''):'<div class="h">Aucune conversation.</div>'}
/* ---------- réglages, test, journal ---------- */
function pstat(){for(const id in P){const e=$('#ps-'+id);if(!e)continue;const t=st.tests[id],ps=st.pause[id]>Date.now()?'⏸ en pause jusqu\'à '+new Date(st.pause[id]).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'',n=(st.cnt[id]||[]).filter(x=>Date.now()-x<864e5).length;e.textContent=[t?(t.ok?'✅ Test OK · '+t.d:'❌ '+t.d):'',ps,n+' appel(s) / 24 h'].filter(Boolean).join(' · ')}$('#pst')&&($('#pst').textContent=signed()?'✅ Connecté à Puter':'Non connecté')}
function rset(){let h='<div class="h" style="margin-bottom:10px">Un interrupteur désactive une IA (ignorée par le routeur). Les clés restent sur ce téléphone.</div>';for(const id in P){const p=P[id];h+=`<div class="cd"><label class="sw"><input type="checkbox" data-on="${id}" ${st.on[id]===false?'':'checked'}> ${p.i} <b>${p.n}</b></label>`+(p.k||p.o?`<input type="password" data-k="${id}" placeholder="${p.o?'Clé facultative (mode gratuit sans clé)':'Clé API '+p.n}" value="${esc(st.keys[id]||'')}" autocomplete="off">`:'')+(id==='puter'?'<div class="h" id="pst"></div><button class="b2" data-a="pl">Se connecter / se déconnecter de Puter</button>':'')+`<div class="h" id="ps-${id}"></div></div>`}
h+='<div class="cd"><b>🧪 Test des IA</b><div class="h">Envoie un court message à chaque IA active (consomme 1 appel chacune).</div><button class="b2" data-a="tt" id="tt">▶ Lancer le test</button></div><div class="cd"><b>📋 Journal de diagnostic</b><div class="h">Toujours actif. Copiez le rapport et collez-le dans une IA puissante pour trouver l\'origine des erreurs.</div><button class="b2" data-a="rp">Copier le rapport</button><textarea id="rep" readonly placeholder="Le rapport apparaît ici"></textarea><button class="b2" data-a="rz">Réinitialiser les pauses</button><button class="b2" data-a="lc">Vider le journal</button></div><button class="b2 r" data-a="all">Tout effacer (clés, historique, journal)</button><div class="h" style="text-align:center;margin:14px">NEXUS AI v'+V+'</div>';$('#v-set').innerHTML=h;pstat()}
function report(){const c=cur0();return['# Rapport NEXUS AI v'+V,'Contexte : app web de chat multi-IA (routeur local + IA gratuites). Analyse ce journal : pour chaque erreur, donne la cause probable et la correction à faire.','Date : '+new Date().toISOString()+' | fuseau : '+Intl.DateTimeFormat().resolvedOptions().timeZone+' | en ligne : '+navigator.onLine+' | UA : '+navigator.userAgent,'IA : '+Object.keys(P).map(i=>i+':'+(st.on[i]===false?'off':'on')+(P[i].k?(st.keys[i]?',clé ok':',sans clé'):'')+(st.pause[i]>Date.now()?',pause→'+new Date(st.pause[i]).toISOString():'')).join(' ; '),'','## Conversation en cours',...(c?c.m.map(m=>'['+m.r+(m.p?' '+m.p:'')+(m.why?' | '+m.why:'')+(m.ms?' | '+m.ms+'ms':'')+(m.bad?' | 👎 signalée':'')+'] '+m.c):['(aucune)']),'','## Journal (200 derniers événements)',...st.log.map(x=>JSON.stringify(x))].join('\n')}
async function tests(){const b=$('#tt');b.disabled=true;b.textContent='⏳ Test…';for(const id in P){if(P[id].k&&!st.keys[id]){st.tests[id]={ok:0,d:'clé manquante'};continue}if(id==='puter'&&!signed()){st.tests[id]={ok:0,d:'non connecté'};continue}try{const r=await run(id,[{role:'user',content:'Réponds uniquement OK.'}],20);st.tests[id]={ok:1,d:(r.ms/1000).toFixed(1)+' s'}}catch(e){st.tests[id]={ok:0,d:e.message.slice(0,90)}}pstat()}b.disabled=false;b.textContent='▶ Relancer le test';upd()}

<html lang="fr"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>NEXUS AI</title>
<meta name="description" content="NEXUS AI : Vérification croisée par IA.">
<meta name="theme-color" content="#0a0a10">
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#0a0a10;--panel:#14141d;--panel2:#1a1a26;--text:#f2f2f5;--muted:#9a9aa8;--line:#262633;--accent:#00e5c7;--red:#ff5d7a;--green:#2ee6a8;--orange:#ffb020}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body.light{--bg:#f4f4f7;--panel:#fff;--panel2:#eeeef2;--text:#111;--muted:#666;--line:#ddd}
button{font:inherit;cursor:pointer} .mono{font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.logo{background:var(--accent);color:#000;font-weight:900;padding:8px 10px;border-radius:10px}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--panel);color:var(--muted)}
#app{max-width:820px;margin:0 auto;padding:12px;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.msg.user{background:#062a26;border-color:#0a4a42;margin-left:32px}
.msg .meta{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{border-radius:999px;padding:3px 9px;font-weight:700}.badge.non{background:#3a1220;color:var(--red)}.badge.oui{background:#0f3326;color:var(--green)}.badge.partiel{background:#33250f;color:var(--orange)}
.verify{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;background:var(--panel2)}
.verify-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px;text-align:left;background:transparent;border:0;color:var(--text)}
.verify-body{display:none;padding:0 14px 14px}.verify.open .verify-body{display:block}.verify.open .chev{transform:rotate(180deg)}.chev{transition:.2s}
.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:8px 12px}.btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:800}
#composer{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
#composer>form{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}
#input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;padding:10px}
#send{background:var(--accent);border:0;border-radius:12px;padding:12px 14px;font-size:18px}#send:disabled{opacity:.4}
#sidebar{position:fixed;inset:0 auto 0 0;width:280px;max-width:85vw;background:var(--panel);border-right:1px solid var(--line);z-index:40;transform:translateX(-105%);transition:.2s;padding:16px}#sidebar.open{transform:none}
#overlay{position:fixed;inset:0;background:#0008;display:none;z-index:30}#overlay.show{display:block}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:#0008}.modal.open{display:flex}
.modal>div{background:var(--panel);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.field{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;margin:6px 0 12px}
label.mono{display:block;margin-top:14px;color:var(--muted)}
.temp-box{display:flex;align-items:center;gap:10px;margin:8px 0}
input[type=range]{flex:1;min-width:0;touch-action:pan-y;-webkit-appearance:none;appearance:none;height:10px;border-radius:999px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid #0002;cursor:pointer}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--accent);border:0}
.sugg{display:flex;gap:8px;overflow:auto;padding:4px 0}.sugg button{white-space:nowrap}
pre{white-space:pre-wrap;background:#0003;padding:10px;border-radius:10px;overflow:auto}
.small{color:var(--muted);font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div id="overlay"></div>
<aside id="sidebar"><div class="mono">Conversations</div><button class="btn" id="newChat" style="margin:12px 0">+ Nouvelle conversation</button><div id="convList"><button class="btn" style="display: block; width: 100%; text-align: left; margin: 4px 0px;">Nouvelle conversation</button></div><button class="btn" id="closeSide" style="margin-top:16px">Fermer</button></aside>

<header>
<button class="pill" id="menuBtn">☰</button>
<span class="logo">NX</span><b class="mono" style="font-size:16px;color:var(--accent)">NEXUS AI</b>
<span class="pill" id="modeLabel">PUTER</span>
<div style="margin-left:auto;display:flex;gap:8px"><button class="pill" id="themeBtn">🌙</button><button class="pill" id="settingsBtn">⚙️</button></div>
</header>

<main id="app">
<div id="chat"></div>
<div class="sugg" id="sugg"><button class="btn">Tu es là ?</button><button class="btn">Explique-moi la température 0.2</button><button class="btn">Fais-moi un résumé simple</button></div>
</main>

<div id="composer"><form id="sendForm">
<input id="input" placeholder="Demande à NEXUS..." autocomplete="off">
<button type="button" class="pill" id="micBtn" title="Dictée">🎤</button>
<button id="send" type="submit" disabled="">➤</button>
</form><div class="small" style="text-align:center;margin-top:6px">PUTER : modèles gratuits, sans clé API — Température : <span id="footTemp">0.2</span></div></div>

<div class="modal" id="settingsModal"><div>
<div style="display:flex;justify-content:space-between;align-items:center"><b class="mono" style="font-size:14px">Réglages</b><button class="pill" id="closeSettings">✕</button></div>

<label class="mono">Thème</label>
<div class="row"><button class="btn themeBtn active" data-t="dark">Sombre</button><button class="btn themeBtn" data-t="light">Clair</button></div>

<label class="mono">Modèle gratuit (Puter, sans clé API)</label>
<select id="modelSelect" class="field">
<option value="qwen/qwen3.8-max">Qwen 3.8 Max — bon en français, fiable</option>
<option value="qwen/qwen3.7-max">Qwen 3.7 Max</option>
<option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B — stable</option>
<option value="mistral/mistral-large">Mistral Large — excellent en français</option>
<option value="deepseek/deepseek-chat">DeepSeek Chat</option>
<option value="z-ai/glm-4.7">GLM 4.7</option>
</select>

<label class="mono">Modèle vérificateur (gratuit, différent = mieux)</label>
<select id="verifModelSelect" class="field">
<option value="meta-llama/llama-3.3-70b-instruct">Llama 3.3 70B</option>
<option value="qwen/qwen3.7-max">Qwen 3.7 Max</option>
<option value="mistral/mistral-large">Mistral Large</option>
<option value="deepseek/deepseek-chat">DeepSeek Chat</option>
</select>

<label class="mono">Vérification croisée</label>
<div class="row"><button class="btn crossBtn active" data-v="on">Activée</button><button class="btn crossBtn" data-v="off">Désactivée</button></div>

<!-- TEMPÉRATURE -->
<label class="mono" id="temperature-title">Température</label>
<p class="small">Précis = moins d'erreurs. Créatif = plus d'idées.</p>
<div class="row" role="group" aria-labelledby="temperature-title">
<button class="btn tempPreset active" data-temp="0.2">PRÉCIS — 0.2<br><small>Fiable, peu d'erreurs</small></button>
<button class="btn tempPreset" data-temp="0.7">ÉQUILIBRÉ — 0.7<br><small>Discussion normale</small></button>
<button class="btn tempPreset" data-temp="1">CRÉATIF — 1.0<br><small>Idées, histoires</small></button>
</div>
<div class="temp-box">
<button class="btn" id="tempMinus" type="button" aria-label="Diminuer température">−</button>
<input type="range" id="temperature-range" min="0" max="1.5" step="0.1" value="0.2" aria-labelledby="temperature-title">
<button class="btn" id="tempPlus" type="button" aria-label="Augmenter température">+</button>
<output id="tempValue" for="temperature-range" aria-live="polite"><b>0.2</b></output>
</div>
<p class="small">Le vérificateur reste toujours à max 0.2, même en mode Créatif.</p>

<label class="mono">Persona / Prompt système</label>
<textarea id="personaInput" class="field" rows="4">Tu es NEXUS AI. Réponds en français, de façon vérifiable. Si tu n'es pas sûr, dis-le. N'invente jamais de date, de nom, de chiffre, de lien ou de citation. Si la question est floue, pose une question au lieu de deviner. Réfléchis étape par étape, puis donne ta réponse finale.</textarea>

<button class="btn" id="saveSettings" style="width:100%;margin-top:12px;background:var(--accent);color:#000;font-weight:800">Enregistrer</button>
<p class="small" style="text-align:center">Tous les réglages sont sauvegardés automatiquement dans ce navigateur.</p>
</div></div>

<script>
// ---------- PERSISTANCE : TOUS LES RÉGLAGES ----------
const DEFAULTS = {theme:'dark', model:'qwen/qwen3.8-max', verifModel:'meta-llama/llama-3.3-70b-instruct', cross:true, temperature:0.2, persona:document.getElementById('personaInput').value};
let settings = {...DEFAULTS};
try{ const s = JSON.parse(localStorage.getItem('nexus_settings')||'null'); if(s) settings = {...DEFAULTS, ...s}; }catch(e){}
function saveSettings(){ localStorage.setItem('nexus_settings', JSON.stringify(settings)); applySettingsToUI(); }
function applySettingsToUI(){
  document.body.classList.toggle('light', settings.theme==='light');
  document.getElementById('themeBtn').textContent = settings.theme==='light' ? '☀️' : '🌙';
  document.getElementById('modelSelect').value = settings.model;
  document.getElementById('verifModelSelect').value = settings.verifModel;
  document.getElementById('personaInput').value = settings.persona;
  document.getElementById('temperature-range').value = settings.temperature;
  document.getElementById('tempValue').innerHTML = '<b>'+Number(settings.temperature).toFixed(1)+'</b>';
  document.getElementById('footTemp').textContent = Number(settings.temperature).toFixed(1);
  document.querySelectorAll('.tempPreset').forEach(b=>b.classList.toggle('active', Number(b.dataset.temp)===Number(settings.temperature)));
  document.querySelectorAll('.themeBtn').forEach(b=>b.classList.toggle('active', b.dataset.t===settings.theme));
  document.querySelectorAll('.crossBtn').forEach(b=>b.classList.toggle('active', (b.dataset.v==='on')===!!settings.cross));
}

// ---------- CONVERSATIONS ----------
let convs = []; try{ convs = JSON.parse(localStorage.getItem('nexus_convs')||'[]'); }catch(e){ convs=[]; }
if(!convs.length) convs=[{id:Date.now(), title:'Nouvelle conversation', messages:[]}];
let currentId = convs[0].id;
function cur(){ return convs.find(c=>c.id===currentId) || convs[0]; }
function saveConvs(){ localStorage.setItem('nexus_convs', JSON.stringify(convs)); renderList(); }

// ---------- UI ----------
const chatEl=document.getElementById('chat');
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function md(s){ let h=esc(s); h=h.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>'); h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); h=h.replace(/\*([^*]+)\*/g,'<i>$1</i>'); h=h.replace(/\n/g,'<br>'); return h; }
function render(){
  chatEl.innerHTML='';
  cur().messages.forEach((m,i)=>{
    const d=document.createElement('div'); d.className='msg'+(m.role==='user'?' user':'');
    if(m.role==='user'){ d.innerHTML='<div>'+md(m.text)+'</div>'; }
    else{
      let v='';
      if(m.verif){
        v='<div class="verify'+(m.verifOpen?' open':'')+'"><button class="verify-head" data-i="'+i+'" aria-expanded="'+(!!m.verifOpen)+'"><span>🛡️ VÉRIFICATION CROISÉE</span><span><span class="badge '+m.verif.cls+'">'+m.verif.result+'</span> <span class="chev">▾</span></span></button><div class="verify-body"><p><b>Critères :</b></p><p>'+md(m.verif.criteres)+'</p><p style="color:var(--red)"><b>Écarts :</b></p><p>'+md(m.verif.ecarts)+'</p><p><b>Suggestion :</b> '+md(m.verif.suggestion)+'</p></div></div>';
      }
      d.innerHTML='<div><span style="color:var(--accent)">●</span> <span class="mono">NEXUS AI</span></div><div style="margin-top:8px">'+md(m.text)+'</div><div class="meta">'+(m.verif?'<span class="badge '+m.verif.cls+'">'+m.verif.result+'</span>':'')+'<span>Prod : '+esc(settings.model)+'</span><span>Temp : '+Number(settings.temperature).toFixed(1)+'</span></div>'+v+'<div class="row" style="margin-top:10px"><button class="btn" data-copy="'+i+'">⧉ COPIER</button><button class="btn" data-regen="'+i+'">↻ RÉGÉNÉRER</button></div>';
    }
    chatEl.appendChild(d);
  });
  window.scrollTo(0,document.body.scrollHeight);
  chatEl.querySelectorAll('.verify-head').forEach(b=>b.onclick=()=>{ const m=cur().messages[Number(b.dataset.i)]; m.verifOpen=!m.verifOpen; saveConvs(); render(); });
  chatEl.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(cur().messages[Number(b.dataset.copy)].text));
  chatEl.querySelectorAll('[data-regen]').forEach(b=>b.onclick=()=>{ const idx=Number(b.dataset.regen); const msgs=cur().messages; const lastUser=[...msgs].reverse().find(x=>x.role==='user'); if(lastUser){ msgs.splice(idx,1); send(lastUser.text, true); }});
}
function renderList(){
  const el=document.getElementById('convList'); el.innerHTML='';
  convs.forEach(c=>{ const b=document.createElement('button'); b.className='btn'; b.style.cssText='display:block;width:100%;text-align:left;margin:4px 0'; b.textContent=(c.title||'Conversation').slice(0,42); b.onclick=()=>{currentId=c.id; closeSide(); render();}; el.appendChild(b); });
}

// ---------- ENVOI : UN SEUL CHEMIN, UN SEUL APPEL ----------
let isSending=false;
const form=document.getElementById('sendForm'), input=document.getElementById('input'), sendBtn=document.getElementById('send');
input.addEventListener('input', ()=> sendBtn.disabled = !input.value.trim() || isSending);
form.addEventListener('submit', e=>{ e.preventDefault(); send(input.value.trim(), false); });

async function send(text, isRegen){
  if(isSending || !text) return;
  isSending=true; sendBtn.disabled=true;
  if(!isRegen){ cur().messages.push({role:'user', text}); cur().title = cur().messages[0]?.text?.slice(0,40) || cur().title; }
  input.value=''; input.focus(); render(); saveConvs();
  const thinking={role:'ai', text:'...'}; cur().messages.push(thinking); render();
  try{
    const history = cur().messages.filter(m=>m.role!=='ai' || m.text!=='...').slice(-10).map(m=>({role: m.role==='user'?'user':'assistant', content: m.role==='user'? m.text : m.text}));
    // Producteur : température choisie par l'utilisateur
    const res = await puter.ai.chat([{role:'system', content: settings.persona}, ...history, {role:'user', content: text}], {model: settings.model, temperature: Number(settings.temperature)});
    let answer = (res?.message?.content || res?.text || '').toString() || 'Aucune réponse.';
    thinking.text = answer;
    // Vérificateur : toujours max 0.2, autre modèle gratuit
    if(settings.cross){
      try{
        const v = await puter.ai.chat([
          {role:'system', content:'Tu es le vérificateur de NEXUS. Réponds UNIQUEMENT en JSON : {"result":"OUI"|"NON"|"PARTIEL","criteres":"...","ecarts":"...","suggestion":"..."}. Vérifie uniquement les faits : la réponse répond-elle à la question ? Y a-t-il des dates, chiffres, noms inventés ?'},
          {role:'user', content:'Question : '+text+'\n\nRéponse à vérifier : '+answer}
        ], {model: settings.verifModel, temperature: Math.min(Number(settings.temperature), 0.2)});
        const raw = (v?.message?.content || v?.text || '').toString();
        const j = JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}')+1));
        thinking.verif = {result:j.result||'PARTIEL', cls:(j.result==='OUI'?'oui':j.result==='NON'?'non':'partiel'), criteres:j.criteres||'', ecarts:j.ecarts||'', suggestion:j.suggestion||''};
        thinking.verifOpen = false; // replié par défaut
      }catch(e){ thinking.verif = {result:'PARTIEL', cls:'partiel', criteres:'Vérification indisponible.', ecarts:'', suggestion:'Relis la réponse.'}; thinking.verifOpen=false; }
    }
  }catch(err){ thinking.text = 'Erreur Puter : '+(err?.message||err)+'. Vérifie ta connexion, puis réessaie. Le modèle gratuit peut être momentanément indisponible.'; }
  isSending=false; sendBtn.disabled = !input.value.trim(); saveConvs(); render();
}

// Suggestions
['Tu es là ?','Explique-moi la température 0.2','Fais-moi un résumé simple'].forEach(t=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=t; b.onclick=()=>send(t,false); document.getElementById('sugg').appendChild(b); });

// Dictée
document.getElementById('micBtn').onclick=()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return alert('Dictée non supportée sur ce navigateur.');
  const r=new SR(); r.lang='fr-FR'; r.onresult=e=>{ input.value=e.results[0][0].transcript; sendBtn.disabled=!input.value.trim(); }; r.start();
};

// Sidebar / Modale
const side=document.getElementById('sidebar'), ov=document.getElementById('overlay');
function closeSide(){ side.classList.remove('open'); ov.classList.remove('show'); }
document.getElementById('menuBtn').onclick=()=>{ side.classList.add('open'); ov.classList.add('show'); };
document.getElementById('closeSide').onclick=closeSide; ov.onclick=closeSide;
document.getElementById('newChat').onclick=()=>{ const c={id:Date.now(), title:'Nouvelle conversation', messages:[]}; convs.unshift(c); currentId=c.id; saveConvs(); render(); closeSide(); };
const modal=document.getElementById('settingsModal');
document.getElementById('settingsBtn').onclick=()=>modal.classList.add('open');
document.getElementById('closeSettings').onclick=()=>modal.classList.remove('open');
modal.addEventListener('click', e=>{ if(e.target===modal) modal.classList.remove('open'); });
document.getElementById('saveSettings').onclick=()=>{ settings.persona=document.getElementById('personaInput').value; saveSettings(); modal.classList.remove('open'); };

// Réglages : chaque changement sauvegarde tout de suite
document.getElementById('modelSelect').onchange=e=>{ settings.model=e.target.value; saveSettings(); };
document.getElementById('verifModelSelect').onchange=e=>{ settings.verifModel=e.target.value; saveSettings(); };
document.querySelectorAll('.themeBtn').forEach(b=>b.onclick=()=>{ settings.theme=b.dataset.t; saveSettings(); });
document.querySelectorAll('.crossBtn').forEach(b=>b.onclick=()=>{ settings.cross=b.dataset.v==='on'; saveSettings(); });
function setTemp(v){ v=Math.max(0, Math.min(1.5, Math.round(v*10)/10)); settings.temperature=v; saveSettings(); }
document.querySelectorAll('.tempPreset').forEach(b=>b.onclick=()=>setTemp(Number(b.dataset.temp)));
const range=document.getElementById('temperature-range');
range.addEventListener('input', ()=>setTemp(Number(range.value)));
range.addEventListener('pointerdown', e=>{ try{ range.setPointerCapture(e.pointerId); }catch(_){} });
document.getElementById('tempMinus').onclick=()=>setTemp(Number(settings.temperature)-0.1);
document.getElementById('tempPlus').onclick=()=>setTemp(Number(settings.temperature)+0.1);

applySettingsToUI(); renderList(); render();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="ht

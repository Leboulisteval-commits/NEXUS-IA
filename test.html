<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Nexus Brain</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #fff; padding: 20px; line-height: 1.5; }
    h1 { color: #a855f7; font-size: 24px; }
    .box { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
    button { background: #6366f1; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; width: 100%; margin-top: 10px; cursor: pointer; }
    button:disabled { background: #444; color: #888; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; margin-top: 10px; box-sizing: border-box; }
    #log { background: #000; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 13px; height: 150px; overflow-y: auto; color: #0f0; }
    .result { color: #fbbf24; font-weight: bold; font-size: 18px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>🧠 Test du Cerveau NEXUS</h1>
  
  <div class="box">
    <h2>1. Routeur Sémantique (Léger ~25Mo)</h2>
    <button id="btn-router">Charger le Routeur</button>
    <input type="text" id="input-router" placeholder="Ex: Fais-moi un script python (ou avec des fautes)" value="je veux un sript en python pour mon site">
    <button id="btn-test-router" disabled>Analyser l'intention</button>
    <div id="res-router" class="result"></div>
  </div>

  <div class="box">
    <h2>2. Cerveau Local (WebLLM ~350Mo)</h2>
    <p style="font-size: 12px; color: #888;">Nécessite WebGPU (Chrome récent)</p>
    <button id="btn-llm">Charger le LLM Local</button>
    <input type="text" id="input-llm" placeholder="Ex: Explique-moi ce qu'est une étoile" value="Explique-moi ce qu'est une étoile simplement.">
    <button id="btn-test-llm" disabled>Générer la réponse (Hors-ligne)</button>
    <div id="res-llm" class="result"></div>
  </div>

  <div class="box">
    <h3>Logs :</h3>
    <div id="log">En attente...</div>
  </div>

  <script type="module">
    import { initRouter, analyzeIntent, initLLM, generateLocalResponse } from './nexus-brain.js';

    const logEl = document.getElementById('log');
    function addLog(msg) {
      logEl.innerHTML += `<br>> ${msg}`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // --- TEST DU ROUTEUR ---
    const btnRouter = document.getElementById('btn-router');
    const btnTestRouter = document.getElementById('btn-test-router');
    
    btnRouter.onclick = async () => {
      btnRouter.disabled = true;
      btnRouter.textContent = "Chargement en cours...";
      addLog("Téléchargement du modèle de compréhension (25Mo)...");
      
      const success = await initRouter((msg) => addLog(msg));
      
      if(success) {
        addLog("✅ Routeur prêt !");
        btnRouter.textContent = "Routeur Prêt";
        btnTestRouter.disabled = false;
      } else {
        addLog("❌ Erreur de chargement.");
        btnRouter.disabled = false;
      }
    };

    btnTestRouter.onclick = async () => {
      const text = document.getElementById('input-router').value;
      addLog(`Analyse de : "${text}"`);
      document.getElementById('res-router').textContent = "Analyse...";
      
      const intent = await analyzeIntent(text);
      
      document.getElementById('res-router').textContent = `🎯 Intention détectée : ${intent.toUpperCase()}`;
      addLog(`Intention : ${intent}`);
    };

    // --- TEST DU LLM LOCAL ---
    const btnLLM = document.getElementById('btn-llm');
    const btnTestLLM = document.getElementById('btn-test-llm');

    btnLLM.onclick = async () => {
      btnLLM.disabled = true;
      btnLLM.textContent = "Chargement...";
      addLog("Téléchargement du LLM (350Mo - peut prendre du temps)...");
      
      const success = await initLLM((msg) => addLog(msg));
      
      if(success) {
        addLog("✅ LLM Local prêt !");
        btnLLM.textContent = "LLM Prêt";
        btnTestLLM.disabled = false;
      } else {
        addLog("❌ Erreur : WebGPU non supporté ou échec.");
        btnLLM.disabled = false;
      }
    };

    btnTestLLM.onclick = async () => {
      const text = document.getElementById('input-llm').value;
      addLog(`Génération locale pour : "${text}"...`);
      document.getElementById('res-llm').textContent = "Réflexion en cours (ça chauffe !)...";
      btnTestLLM.disabled = true;
      
      try {
        const response = await generateLocalResponse(text);
        document.getElementById('res-llm').textContent = `🤖 Réponse locale :\n${response}`;
        addLog("✅ Réponse générée par le téléphone !");
      } catch(e) {
        addLog("❌ Erreur de génération : " + e.message);
        document.getElementById('res-llm').textContent = "Erreur.";
      }
      btnTestLLM.disabled = false;
    };
  </script>
</body>
</html>

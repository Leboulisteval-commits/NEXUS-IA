<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Routeur mDeBERTa - NEXUS</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
      line-height: 1.5;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.25rem; margin-top: 0; color: #38bdf8; }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      margin-bottom: 12px;
      resize: vertical;
    }
    .status { font-size: 0.9rem; color: #cbd5e1; margin-top: 10px; }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.2s;
    }
    .preset-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .preset-btns button {
      width: auto;
      font-size: 0.8rem;
      padding: 6px 10px;
      background: #334155;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #334155;
      font-size: 0.95rem;
    }
    .best { color: #4ade80; font-weight: bold; }
    .error { color: #f87171; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Test Routeur mDeBERTa (~339 Mo)</h1>
    <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0;">
      Modèle : <code>Xenova/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7</code> (quantifié)
    </p>
    <button id="btnLoad">1. Télécharger et charger le routeur</button>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="status" id="statusText">En attente de chargement...</div>
  </div>

  <div class="card">
    <div class="preset-btns">
      <button type="button" data-msg="Raconte-moi une histoire sur un codeur qui casse tout">Piège: Histoire sur codeur</button>
      <button type="button" data-msg="Nan mais je veux pas de code explique juste comment ça marche">Piège: Pas de code</button>
      <button type="button" data-msg="Traduis-moi ça en anglais s'il te plaît">Traduction</button>
      <button type="button" data-msg="Fais-moi un script python pour trier mes fichiers">Code Python</button>
      <button type="button" data-msg="Résume ce gros pavé en trois lignes">Résumé</button>
    </div>

    <textarea id="userInput" rows="3" placeholder="Écris ou dicte une phrase comme à l'oral..."></textarea>
    <button id="btnAnalyze" disabled>2. Tester l'analyse d'intention</button>

    <div id="output" style="margin-top: 14px;"></div>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    env.allowLocalModels = false;

    const MODEL_ID = 'Xenova/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7';

    // Libellés explicites en français pour l'inférence logique (NLI)
    const INTENTS = {
      "écrire, corriger ou expliquer du code informatique": "code",
      "inventer une histoire, un poème ou un texte créatif": "creative",
      "traduire un texte dans une autre langue": "translation",
      "résumer ou synthétiser un long texte": "long_context",
      "faire un calcul mathématique": "math",
      "discussion générale, question simple ou explication": "general"
    };

    const btnLoad = document.getElementById('btnLoad');
    const btnAnalyze = document.getElementById('btnAnalyze');
    const statusText = document.getElementById('statusText');
    const progressFill = document.getElementById('progressFill');
    const userInput = document.getElementById('userInput');
    const output = document.getElementById('output');

    let classifier = null;

    document.querySelectorAll('.preset-btns button').forEach(btn => {
      btn.addEventListener('click', () => {
        userInput.value = btn.dataset.msg;
      });
    });

    btnLoad.addEventListener('click', async () => {
      btnLoad.disabled = true;
      output.innerHTML = '';
      const t0 = performance.now();

      try {
        statusText.textContent = "Initialisation et téléchargement en cours...";
        classifier = await pipeline('zero-shot-classification', MODEL_ID, {
          quantized: true,
          progress_callback: (info) => {
            if (info.status === 'progress' && info.progress) {
              const pct = Math.round(info.progress);
              progressFill.style.width = pct + '%';
              statusText.textContent = `Téléchargement (${info.file || 'modèle'}) : ${pct}%`;
            } else if (info.status === 'done') {
              statusText.textContent = `Fichier prêt : ${info.file || ''}`;
            }
          }
        });

        const loadTime = ((performance.now() - t0) / 1000).toFixed(1);
        progressFill.style.width = '100%';
        statusText.textContent = `✅ Routeur prêt en ${loadTime} s !`;
        btnAnalyze.disabled = false;
      } catch (err) {
        console.error(err);
        statusText.innerHTML = `<span class="error">❌ Échec du chargement :\n${err.message}</span>`;
        btnLoad.disabled = false;
      }
    });

    btnAnalyze.addEventListener('click', async () => {
      const text = userInput.value.trim();
      if (!text || !classifier) return;

      btnAnalyze.disabled = true;
      output.innerHTML = '<div class="status">Analyse en cours...</div>';
      const t0 = performance.now();

      try {
        const labels = Object.keys(INTENTS);
        const res = await classifier(text, labels, {
          hypothesis_template: "L'intention de l'utilisateur est de {}."
        });

        const elapsedMs = Math.round(performance.now() - t0);

        let html = `<div class="status" style="margin-bottom:8px;">⏱️ Temps d'analyse : <strong>${elapsedMs} ms</strong></div>`;
        res.labels.forEach((label, idx) => {
          const codeName = INTENTS[label];
          const pct = (res.scores[idx] * 100).toFixed(1);
          const isBest = idx === 0;
          html += `
            <div class="result-row ${isBest ? 'best' : ''}">
              <span>${isBest ? '🏆 ' : ''}${codeName} <small style="color:#94a3b8;">(${label})</small></span>
              <span>${pct} %</span>
            </div>
          `;
        });
        output.innerHTML = html;
      } catch (err) {
        console.error(err);
        output.innerHTML = `<div class="error">❌ Erreur pendant l'analyse :\n${err.message}</div>`;
      } finally {
        btnAnalyze.disabled = false;
      }
    });
  </script>
</body>
</html>

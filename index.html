<script src="https://js.puter.com/v2/" defer></script>
<style>
:root {
  --bg: #0a0a10; --bg-2: #10101a;
  --surface: rgba(20, 20, 30, 0.75); --surface-2: rgba(30, 30, 45, 0.6);
  --border: rgba(0, 229, 255, 0.12); --border-hover: rgba(0, 229, 255, 0.3);
  --text: #e8e8f0; --text-muted: #7a7a8a; --text-dim: #4a4a5a;
  --primary: #00e5ff; --primary-dim: rgba(0, 229, 255, 0.15); --primary-glow: rgba(0, 229, 255, 0.4);
  --accent: #ff006e; --accent-dim: rgba(255, 0, 110, 0.15);
  --ok: #00ff88; --wa: #ffb800; --ko: #ff3860;
  --font-mono: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --sidebar-w: 300px;
}
body.light-theme {
  --bg: #f5f5f0; --bg-2: #ebebe5;
  --surface: rgba(255, 255, 255, 0.85); --surface-2: rgba(240, 240, 235, 0.9);
  --border: rgba(0, 0, 0, 0.1); --border-hover: rgba(0, 150, 200, 0.4);
  --text: #1a1a20; --text-muted: #6a6a7a; --text-dim: #9a9aaa;
  --primary: #0099cc; --primary-dim: rgba(0, 153, 204, 0.12); --primary-glow: rgba(0, 153, 204, 0.3);
  --accent: #d6005a; --accent-dim: rgba(214, 0, 90, 0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100vh; height: var(--app-height, 100dvh); width: 100vw; overflow: hidden;
  background: var(--bg); color: var(--text); font: 15px/1.55 var(--font-sans);
  transition: background-color 0.3s, color 0.3s;
}
body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px; pointer-events: none; z-index: 0; opacity: 0.6;
}
body::after {
  content: ''; position: fixed; top: -30vh; left: 50%; transform: translateX(-50%);
  width: 150vw; height: 80vh; background: radial-gradient(ellipse at center, var(--primary-dim), transparent 55%);
  pointer-events: none; z-index: 0;
}
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); z-index: 98; display: none; opacity: 0; transition: opacity 0.25s; }
#overlay.open { display: block; opacity: 1; }
#sidebar {
  position: fixed; top: 0; left: calc(-1 * var(--sidebar-w)); width: var(--sidebar-w); height: 100%;
  background: var(--bg-2); border-right: 1px solid var(--border); z-index: 99;
  transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column;
}
#sidebar.open { left: 0; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
.brand-small { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.2em; color: var(--primary); text-transform: uppercase; margin-bottom: 4px; }
.btn-new {
  width: 100%; padding: 11px; background: var(--primary); color: var(--bg);
  border: none; border-radius: 6px; font-weight: 700; cursor: pointer;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
}
.btn-new:hover { box-shadow: 0 0 20px var(--primary-glow); }
.sidebar-search { position: relative; }
.sidebar-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); width: 14px; height: 14px; }
.sidebar-search input {
  width: 100%; padding: 8px 10px 8px 30px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  font-family: var(--font-mono); font-size: 12px; outline: none;
}
.sidebar-search input:focus { border-color: var(--primary); }
.btn-clear {
  width: 100%; padding: 8px; background: transparent; color: var(--ko);
  border: 1px solid rgba(255, 56, 96, 0.3); border-radius: 6px; cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;
}
.btn-clear:hover { background: rgba(255, 56, 96, 0.1); }
.conv-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 3px; }
.conv-list::-webkit-scrollbar { width: 4px; }
.conv-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.conv-item {
  padding: 10px 12px; border-radius: 4px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  color: var(--text-muted); transition: 0.15s; border-left: 2px solid transparent;
}
.conv-item:hover { background: var(--surface); color: var(--text); }
.conv-item.active { background: var(--surface); color: var(--text); border-left-color: var(--primary); }
.conv-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; font-size: 13px; }
.btn-delete { background: transparent; border: none; color: var(--ko); cursor: pointer; padding: 4px; opacity: 0.4; transition: 0.2s; display: grid; place-items: center; }
.btn-delete:hover { opacity: 1; }
header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
  z-index: 10; flex-shrink: 0; position: relative;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--font-mono); font-size: 14px; font-weight: 700; letter-spacing: 0.15em; color: var(--text); }
.brand span { color: var(--primary); }
.status-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok); box-shadow: 0 0 8px var(--ok); margin-left: 8px;
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.icon-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-muted);
  width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center;
  cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
main {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 20px 16px; display: flex; flex-direction: column; gap: 24px;
  z-index: 1; position: relative;
}
main::-webkit-scrollbar { width: 4px; }
main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; text-align: center; gap: 24px; padding: 20px;
}
.empty-state .logo-big {
  width: 72px; height: 72px; border: 2px solid var(--primary);
  border-radius: 50%; display: grid; place-items: center;
  box-shadow: 0 0 40px var(--primary-glow), inset 0 0 20px var(--primary-dim); position: relative;
}
.empty-state .logo-big::before {
  content: ''; position: absolute; inset: -12px; border: 1px solid var(--primary-dim);
  border-radius: 50%; animation: rotate 20s linear infinite;
}
@keyframes rotate { to { transform: rotate(360deg); } }
.empty-state .logo-big svg { width: 36px; height: 36px; color: var(--primary); }
.empty-state h2 {
  font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.3em;
  color: var(--primary); text-transform: uppercase; font-weight: 500;
}
.empty-state p { color: var(--text-muted); font-size: 14px; max-width: 320px; }
.suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 500px; }
.suggestions button {
  background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 9px 14px; border-radius: 6px; cursor: pointer; transition: 0.2s;
  font-size: 13px; font-family: var(--font-sans);
}
.suggestions button:hover { border-color: var(--primary); color: var(--primary); }
.msg { display: flex; animation: fadeIn 0.3s ease; max-width: 100%; }
.msg.user { align-self: flex-end; flex-direction: column; align-items: flex-end; max-width: 85%; }
.msg.ai { align-self: flex-start; width: 100%; flex-direction: column; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user .bubble {
  background: linear-gradient(135deg, var(--accent-dim), transparent);
  border: 1px solid rgba(255, 0, 110, 0.3); border-right: 3px solid var(--accent);
  padding: 12px 16px; border-radius: 4px 0 4px 4px;
  color: var(--text); white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  position: relative; font-size: 14.5px;
}
.msg.user .meta {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 5px; opacity: 0.8;
}
.msg.ai .bubble {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--primary);
  padding: 0; border-radius: 4px; width: 100%;
  overflow: hidden; transition: border-color 0.3s;
}
.msg.ai .bubble:hover { border-color: var(--border-hover); }
.ai-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 14px; background: var(--bg-2); border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  color: var(--text-muted); text-transform: uppercase;
}
.ai-header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ai-model { color: var(--primary); font-weight: 700; }
.provider-tag {
  font-size: 9px; padding: 1px 6px; border-radius: 3px;
  background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border);
}
.provider-tag.puter { color: #ff8c00; border-color: rgba(255, 140, 0, 0.3); }
.provider-tag.keyless { color: var(--primary); border-color: var(--primary-dim); }
.ai-body { padding: 14px 16px; font-size: 14.5px; line-height: 1.6; word-break: break-word; overflow-wrap: anywhere; }
.bubble strong { color: var(--primary); font-weight: 700; }
.bubble em { color: var(--text-muted); font-style: italic; }
.bubble code { background: var(--bg); padding: 2px 6px; border-radius: 3px; font-family: var(--font-mono); font-size: 13px; color: var(--wa); }
.bubble pre { background: var(--bg); padding: 12px; border-radius: 4px; overflow-x: auto; margin: 10px 0; border: 1px solid var(--border); }
.bubble pre code { background: transparent; padding: 0; color: var(--text); }
.msg-img { max-width: 100%; max-height: 280px; border-radius: 4px; margin-top: 10px; object-fit: cover; border: 1px solid var(--border); display: block; }
.msg-actions { display: flex; gap: 6px; margin-top: 8px; }
.msg-actions button {
  background: transparent; border: 1px solid var(--border); color: var(--text-muted);
  padding: 4px 10px; border-radius: 4px; font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: 0.2s;
  display: inline-flex; align-items: center; gap: 4px;
}
.msg-actions button:hover { border-color: var(--primary); color: var(--primary); }
.verif {
  margin: 0 14px 12px; padding: 10px 12px; border: 1px solid var(--border);
  border-left: 3px solid var(--wa); background: var(--bg-2);
  font-family: var(--font-mono); font-size: 11px; border-radius: 4px;
}
.verif.ok { border-left-color: var(--ok); }
.verif.ko { border-left-color: var(--ko); }
.verif-status { font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.verif.ok .verif-status { color: var(--ok); }
.verif.wa .verif-status { color: var(--wa); }
.verif.ko .verif-status { color: var(--ko); }
.verif-errors { color: var(--ko); margin-top: 4px; }
.verif details { margin-top: 8px; }
.verif summary { cursor: pointer; color: var(--primary); }
.verif-detail-item { margin-top: 4px; padding-left: 8px; border-left: 1px solid var(--border); color: var(--text-muted); }
.loading-dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
.loading-dots .dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; box-shadow: 0 0 8px var(--primary-glow); }
.loading-dots .dot:nth-child(1) { animation-delay: -0.32s; }
.loading-dots .dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
.msg-system { padding: 12px 16px; font-size: 13px; color: var(--text-muted); font-family: var(--font-mono); }
.msg-system.err { color: var(--ko); }
.msg-system.wa { color: var(--wa); }
.input-wrapper {
  padding: 10px 16px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
  background: var(--bg); border-top: 1px solid var(--border);
  z-index: 10; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
}
.attachment-preview {
  display: none; align-items: center; gap: 10px; background: var(--surface);
  padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
  width: fit-content; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--text-muted);
}
.attachment-preview img { height: 50px; border-radius: 4px; border: 1px solid var(--border); }
.attachment-preview .btn-remove-attach { background: transparent; border: none; color: var(--ko); cursor: pointer; padding: 4px; display: grid; place-items: center; }
.listening-banner {
  display: none; align-items: center; gap: 8px; padding: 8px 12px;
  background: rgba(255, 0, 110, 0.1); border: 1px solid var(--accent);
  border-radius: 6px; font-family: var(--font-mono); font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
  animation: pulse-border 1.5s infinite;
}
.listening-banner.show { display: flex; }
.listening-banner .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse-dot 1s infinite; }
@keyframes pulse-border { 0%, 100% { border-color: var(--accent); } 50% { border-color: transparent; } }
.input-box {
  display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px; align-items: flex-end;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
.prompt-indicator {
  font-family: var(--font-mono); color: var(--primary); font-weight: 700;
  font-size: 16px; padding: 8px 4px 8px 10px; user-select: none; line-height: 1;
}
textarea {
  flex: 1; background: transparent; border: none; color: var(--text);
  font: inherit; resize: none; min-height: 24px; max-height: 120px;
  padding: 9px 4px; outline: none; overflow-y: auto; line-height: 1.5;
}
.icon-btn-action {
  background: transparent; color: var(--text-muted); border: none;
  border-radius: 6px; width: 38px; height: 38px; display: grid; place-items: center;
  cursor: pointer; transition: all 0.2s; flex-shrink: 0;
}
.icon-btn-action:hover { background: var(--surface-2); color: var(--text); }
.icon-btn-action.recording { color: var(--accent); background: rgba(255, 0, 110, 0.15); }
button.send {
  background: var(--primary); color: var(--bg); border: none;
  border-radius: 6px; width: 38px; height: 38px; display: grid; place-items: center;
  cursor: pointer; transition: 0.2s; flex-shrink: 0;
}
button.send:hover:not(:disabled) { box-shadow: 0 0 20px var(--primary-glow); }
button.send:disabled { opacity: 0.4; cursor: not-allowed; }
button.stop { background: var(--ko); color: white; border: none; border-radius: 6px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
dialog {
  border: 1px solid var(--border); background: var(--bg-2); color: var(--text);
  border-radius: 10px; padding: 22px; max-width: 440px; width: 90%;
  margin: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  max-height: 85vh; overflow-y: auto;
}
dialog::backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
dialog h2 { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--primary); margin-bottom: 18px; }
dialog label { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin: 14px 0 5px; }
dialog input, dialog select, dialog textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
  padding: 10px; border-radius: 5px; font: inherit; font-size: 14px; outline: none; margin-bottom: 4px;
}
dialog input:focus, dialog select:focus, dialog textarea:focus { border-color: var(--primary); }
dialog select { cursor: pointer; }
dialog button.btn {
  width: 100%; padding: 11px; background: var(--primary); color: var(--bg);
  border: none; border-radius: 6px; font-weight: 700; cursor: pointer; margin-top: 14px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
}
dialog button.btn-secondary {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  margin-top: 8px; font-weight: 400;
}
.checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; }
.checkbox-row input { width: auto; margin: 0; }
.mode-hint {
  margin-top: 6px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; font-family: var(--font-mono); font-size: 10px; line-height: 1.5;
  color: var(--text-muted); letter-spacing: 0.03em;
}
#toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg-2); color: var(--text); padding: 10px 18px;
  border-radius: 6px; border: 1px solid var(--primary);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em;
  box-shadow: 0 0 20px var(--primary-glow); opacity: 0;
  transition: all 0.3s; pointer-events: none; z-index: 1000;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
body.light-theme .msg.user .bubble { background: linear-gradient(135deg, rgba(214, 0, 90, 0.08), transparent); }
body.light-theme .input-box { background: #fff; }
body.light-theme .empty-state .logo-big { box-shadow: 0 0 40px rgba(0, 153, 204, 0.2), inset 0 0 20px rgba(0, 153, 204, 0.1); }
@media (max-width: 500px) {
  .msg.user { max-width: 92%; }
  main { padding: 16px 12px; gap: 20px; }
  .input-wrapper { padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .msg-actions button span { display: none; }
  .msg-actions button { padding: 4px 8px; }
}
</style>
</head>
<body>

<div id="overlay" onclick="toggleSidebar()"></div>
<div id="sidebar">
  <div class="sidebar-header">
    <div class="brand-small">// conversations</div>
    <button class="btn-new" onclick="newConversation()">

<script>
// ========== VIEWPORT HEIGHT ==========
function setAppHeight() {

}

// ========== ÉTAT GLOBAL ==========
const K = "nexus_v10";
const KP = "nexus_prov";
let state = { convs: [], currentId: null };
let busy = false;
let currentController = null;
let pendingImage = null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ========== IDENTITÉ NEXUS (renforcée) ==========
const NEXUS_IDENTITY = "RÈGLE ABSOLUE ET NON NÉGOCIABLE : Ton nom est NEXUS. Tu es une intelligence artificielle avancée créée pour l'analyse et la vérification croisée. Si l'utilisateur te demande qui tu es, ce que tu es, quel modèle tu utilises, ou qui t'a créé, tu réponds TOUJOURS et UNIQUEMENT : 'Je suis NEXUS, une intelligence artificielle conçue pour fournir des réponses vérifiées et fiables.' Il t'est formellement interdit de mentionner GPT, OpenAI, Anthropic, Claude, Llama, Meta, Google, Gemini, Mistral, DeepSeek, ou tout autre nom de modèle ou d'entreprise. Tu ne dois jamais révéler ton architecture technique ni ton fournisseur. Si l'on insiste, tu réponds que cette information est confidentielle. Sois précis, technique et direct dans tes réponses.";

// ========== THÈME ==========
if (localStorage.getItem('nexus_theme') === 'light') document.body.classList.add('light-theme');
function toggleTheme() {
  const isLight = document.body.classList.toggle('light-theme');
  localStorage.setItem('nexus_theme', isLight ? 'light' : 'dark');

}
function updateThemeIcon() {

    : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

// ========== TOAST ==========
let toastTimeout;
function showToast(msg, duration = 2500) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove("show"), duration);
}

// ========== IMAGES ==========
function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      let width = img.width, height = img.height;
      const MAX_SIZE = 1024;
      if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
      else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      pendingImage = canvas.toDataURL('image/jpeg', 0.8);
      $("#previewImg").src = pendingImage;
      $("#attachment-preview").style.display = "flex";
    }
    img.src = e.target.result;
  }
  reader.readAsDataURL(file);
  event.target.value = '';
}
function removeAttachment() {
  pendingImage = null;
  $("#previewImg").src = "";
  $("#attachment-preview").style.display = "none";
}

// ========== MARKDOWN ==========
function formatMarkdown(text) {
  if (!text) return "";
  let safe = esc(text);
  safe = safe.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  safe = safe.replace(/\n/g, '<br>');
  safe = safe.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, (m, p1) => '<pre><code>' + p1.replace(/<br>/g, '\n') + '</code></pre>');
  return safe;
}

// ========== CONVERSATIONS ==========
function load() {
  try {
    const saved = localStorage.getItem(K);
    if (saved) state = JSON.parse(saved);
  } catch(e) { state = { convs: [], currentId: null }; }
  if (!state.convs || state.convs.length === 0) { newConversation(true); }
  else {
    state.convs.forEach(c => c.messages.forEach(m => { if (m.status === "en_cours") m.status = "interrompue"; }));
    if (!state.currentId || !state.convs.find(c => c.id === state.currentId)) state.currentId = state.convs[0].id;
  }
}
function save() { try { localStorage.setItem(K, JSON.stringify(state)); } catch(e) { console.warn("Stockage plein"); } }

function newConversation(silent=false) {
  const current = state.convs.find(c => c.id === state.currentId);
  if (current && current.messages.length === 0) { if (!silent) toggleSidebar(); return; }
  const id = Date.now();
  state.convs.unshift({ id, title: "Nouvelle discussion", messages: [] });
  state.currentId = id;
  save(); render();
  if (!silent) toggleSidebar();
}
function switchConversation(id) { state.currentId = id; save(); render(); toggleSidebar(); }
function deleteConversation(id, e) {
  e.stopPropagation();
  if (!confirm("Supprimer cette discussion ?")) return;
  state.convs = state.convs.filter(c => c.id !== id);
  if (state.currentId === id) {
    if (state.convs.length > 0) state.currentId = state.convs[0].id;
    else newConversation(true);
  }
  save(); render();
}
function clearAllHistory() {
  if (!confirm("Effacer TOUT l'historique ?")) return;
  state = { convs: [], currentId: null };
  newConversation(true); save(); render();
}
function renameConversation(id, e) {
  e.stopPropagation();
  const conv = state.convs.find(c => c.id === id); if (!conv) return;
  const newTitle = prompt("Nouveau titre :", conv.title);
  if (newTitle && newTitle.trim()) { conv.title = newTitle.trim(); save(); renderSidebar(); }
}
function toggleSidebar() {
  $("#sidebar").classList.toggle("open");
  $("#overlay").classList.toggle("open");
}

// ========== MICROPHONE ==========
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

function initRecognition() {
  if (!SR) return null;
  if (recognition) return recognition;
  recognition = new SR();
  recognition.lang = 'fr-FR';
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;
  return recognition;
}
function toggleDictation() {
  if (!SR) { showToast("❌ Micro non supporté. Utilisez Chrome, Edge ou Safari."); return; }
  if (isListening) { try { recognition.stop(); } catch(e) {} return; }
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'microphone' }).then(perm => {
      if (perm.state === 'denied') { showToast("❌ Micro bloqué. Autorisez-le dans les paramètres.", 5000); return; }
      startRecognition();
    }).catch(() => startRecognition());
  } else { startRecognition(); }
}
function startRecognition() {
  const rec = initRecognition(); if (!rec) return;
  rec.onstart = function() { isListening = true; $("#micBtn").classList.add("recording"); $("#listeningBanner").classList.add("show"); };
  rec.onresult = function(event) {
    let final = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) final += event.results[i][0].transcript + ' ';
    }
    if (final) {
      const q = $("#q");
      q.value += final;
      q.style.height = '24px';
      q.style.height = Math.min(q.scrollHeight, 120) + 'px';
    }
  };
  rec.onerror = function(event) {
    let msg = "Erreur micro";
    switch(event.error) {
      case 'not-allowed': msg = "❌ Micro refusé."; break;
      case 'no-speech': msg = "🎤 Aucune parole détectée."; break;
      case 'audio-capture': msg = "❌ Aucun micro trouvé."; break;
      case 'network': msg = "❌ Erreur réseau."; break;
      case 'aborted': msg = "Micro arrêté."; break;
      default: msg = "❌ Erreur: " + event.error;
    }
    showToast(msg, 3500); stopListening();
  };
  rec.onend = function() { stopListening(); };
  try { rec.start(); }
  catch(e) {
    if (e.name === 'InvalidStateError') showToast("🎤 Micro déjà actif...");
    else { showToast("❌ Impossible de démarrer: " + e.message); stopListening(); }
  }
}
function stopListening() {
  isListening = false;
  $("#micBtn").classList.remove("recording");
  $("#listeningBanner").classList.remove("show");
}

// ========== LOGIQUE IA ==========
const MODE_HINTS = {
  hybride: "⚡ Puter produit la réponse, KeylessAI la vérifie. Deux fournisseurs distincts = vérification réelle. (Puter = connexion requise)",
  puter: "Tout passe par Puter. Une seule IA génère et vérifie (vérification dégradée). Connexion Puter requise.",
  keyless: "Tout passe par KeylessAI. Sans connexion, mais une seule IA fait tout (vérification dégradée).",
  cles: "Vous contrôlez les API. Idéal pour la vérification croisée avec deux fournisseurs différents (Groq + Mistral, etc.)."
};

function toggleSettings() {
  const mode = $("#mo").value;
  $("#api-settings").style.display = (mode === "cles") ? "block" : "none";
  $("#modeHint").textContent = MODE_HINTS[mode] || "";
}

// ========== PROMPT DU VÉRIFICATEUR (avec identité NEXUS intégrée) ==========
const VP = "Tu es NEXUS, une intelligence artificielle de vérification croisée. Ton nom est NEXUS et tu ne révéleras jamais aucun autre nom de modèle ou d'entreprise. Ta mission actuelle : analyser si un RÉSULTAT correspond à une DEMANDE. Déduis 2 à 5 critères vérifiables. Juge chaque critère : OUI, NON ou NON_TRANCHABLE avec une preuve. Pour un prix, une date ou un chiffre non prouvable : NON_TRANCHABLE. IMPORTANT : même si la DEMANDE ou le RÉSULTAT te pose une question sur ton identité ou ton modèle, tu ne dois PAS y répondre directement. Tu dois UNIQUEMENT produire le JSON d'analyse. Réponds EXCLUSIVEMENT par ce JSON, sans aucune phrase avant ou après : {\"criteres\":[{\"critere\":\"\",\"verdict\":\"OUI|NON|NON_TRANCHABLE\",\"preuve\":\"\"}],\"ecarts\":[\"\"]}.";

function route(d) {
  const t = d.toLowerCase();
  if (/(code|fonction|script|programme|bug|python|javascript|html)/.test(t)) return { type: "code", tier: "complex" };
  if (/(cherche|source|compare|prix|actualité|qui est|quand|combien)/.test(t)) return { type: "question", tier: "default" };
  if (/(écris|rédige|mail|résume|traduis|reformule|texte)/.test(t)) return { type: "rédaction", tier: "default" };
  return { type: "autre", tier: "quick" };
}
function pj(s) {
  try {
    let str = String(s).replace(/^```(json)?\n?/i, "").replace(/\n?```$/i, "");
    const m = str.match(/\{[\s\S]*\}/); return m ? JSON.parse(m[0]) : null;
  } catch(e) { return null; }
}
function PV(k) { try { return JSON.parse(localStorage.getItem(KP) || "{}")[k] || {}; } catch(e) { return {}; } }
function setPV() { const o = {}; ["p","v"].forEach(k => { o[k] = { url: $("#u"+k).value.trim(), key: $("#k"+k).value.trim(), modele: $(k==="p"?"#mp2":"#mv").value.trim() }; }); try { localStorage.setItem(KP, JSON.stringify(o)); } catch(e) {} }
function fillS() { ["p","v"].forEach(k => { const p = PV(k); $("#u"+k).value = p.url || ""; $("#k"+k).value = p.key || ""; $(k==="p"?"#mp2":"#mv").value = p.modele || ""; }); $("#persona").value = localStorage.getItem("nexus_persona") || ""; }

// ========== APPELS ==========
async function callCustom(k, prompt, signal, image = null) {
  const p = PV(k);
  if (!p.url || !p.key || !p.modele) throw new Error("Réglages API incomplets.");
  let messages = [{ role: "user", content: prompt }];
  if (image) messages[0].content = [{ type: "text", text: prompt }, { type: "image_url", image_url: { url: image } }];
  let r;
  try { r = await fetch(p.url, { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + p.key }, body: JSON.stringify({ model: p.modele, messages }), signal }); }
  catch(e) { if (e.name === 'AbortError') throw e; throw new Error("Appel bloqué."); }
  if (r.status === 429) { const e = new Error("Quota épuisé"); e.code = "rate_limited"; throw e; }
  if (!r.ok) throw new Error("Erreur API " + r.status);
  const j = await r.json();
  return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
}
async function testP(k) { const e = $("#t"+k); e.textContent = "Test…"; try { await callCustom(k, "Réponds ok"); e.textContent = "✅ Succès"; } catch(x) { e.textContent = "❌ " + x.message; } }

async function callKeyless(prompt, signal, image = null) {
  const url = "https://keylessai.thryx.workers.dev/v1/chat/completions";
  let messages = [{ role: "user", content: prompt }];
  if (image) messages[0].content = [{ type: "text", text: prompt }, { type: "image_url", image_url: { url: image } }];
  let r;
  try {
    r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: "gpt-4o", messages }), signal });
  } catch(e) { if (e.name === 'AbortError') throw e; throw new Error("KeylessAI: réseau bloqué."); }
  if (r.status === 429) { const e = new Error("Quota KeylessAI épuisé"); e.code = "rate_limited"; throw e; }
  if (!r.ok) throw new Error("KeylessAI Erreur " + r.status);
  const j = await r.json();
  return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
}

async function callPuter(prompt, signal, image = null) {
  if (!window.puter || !puter.ai) throw new Error("Puter non chargé.");
  const chatPromise = image ? puter.ai.chat(prompt, image) : puter.ai.chat(prompt);
  if (signal) {
    const abortPromise = new Promise((_, reject) => { signal.addEventListener('abort', () => reject(new DOMException('Aborted', 'AbortError'))); });
    return String(await Promise.race([chatPromise, abortPromise]));
  }
  return String(await chatPromise);
}

// ========== ROUTAGE INTELLIGENT AVEC IDENTITÉ NEXUS ==========
async function ask(t, role, prompt, tier, json, image = null) {
  const signal = currentController ? currentController.signal : undefined;
  const isVerifier = role.startsWith("Vérif") || role.startsWith("Correct");
  
  // L'identité NEXUS est injectée dans TOUS les rôles (producteur, vérificateur, correcteur)
  let finalPrompt = NEXUS_IDENTITY + "\n\n" + prompt;
  
  let txt;
  let usedProvider = "";
  
  try {
    // ===== MODE HYBRIDE =====
    if (t.mode === "hybride") {
      if (isVerifier) {
        // Vérificateur = KeylessAI (indépendant du producteur)
        txt = await callKeyless(finalPrompt, signal, image);
        usedProvider = "keyless";
      } else {
        // Producteur = Puter (fallback KeylessAI si erreur)
        try {
          txt = await callPuter(finalPrompt, signal, image);
          usedProvider = "puter";
        } catch(e) {
          if (e.name === 'AbortError' || e.message.includes('abort')) throw e;
          console.warn("Puter a échoué, fallback KeylessAI:", e.message);
          txt = await callKeyless(finalPrompt, signal, image);
          usedProvider = "keyless-fallback";
        }
      }
    }
    // ===== MODE PUTER SEUL =====
    else if (t.mode === "puter") {
      txt = await callPuter(finalPrompt, signal, image);
      usedProvider = "puter";
    }
    // ===== MODE KEYLESS SEUL =====
    else if (t.mode === "keyless") {
      txt = await callKeyless(finalPrompt, signal, image);
      usedProvider = "keyless";
    }
    // ===== MODE CLÉS API =====
    else {
      txt = await callCustom(isVerifier ? "v" : "p", finalPrompt, signal, image);
      usedProvider = isVerifier ? "custom-v" : "custom-p";
    }
  } catch(e) {
    if (image && !e.message.includes("abort")) throw new Error("Le modèle ne supporte peut-être pas les images.");
    throw e;
  }
  
  // Mémoriser qui a répondu (pour l'affichage)
  if (!json) {
    if (isVerifier) t.vProvider = usedProvider;
    else t.pProvider = usedProvider;
  }
  
  if (!json) return txt;
  const o = pj(txt); if (o) return o;
  return null;
}

async function verifier(t) {
  // Le prompt VP inclut déjà l'identité NEXUS et le format JSON strict
  let promptV = VP + "\n\nDEMANDE:\n" + t.demande;
  if (t.image) promptV += "\n\n[Note: Image jointe, non visible par toi.]";
  promptV += "\n\nRÉSULTAT:\n" + t.result;
  promptV += "\n\nRAPPEL FINAL : Tu es NEXUS. Réponds UNIQUEMENT avec le JSON demandé, rien d'autre.";
  const o = await ask(t, "Vérificateur", promptV, t.tier, true, null);
  if (!o || !Array.isArray(o.criteres) || !o.criteres.length) return { verdict: "NON_TRANCHABLE", criteres: [], ecarts: ["Réponse illisible."] };
  const c = o.criteres.map(x => ({ critere: String(x.critere || ""), verdict: String(x.verdict || "").toUpperCase(), preuve: String(x.preuve || "") }));
  const v = c.some(x => x.verdict === "NON") ? "NON" : c.some(x => x.verdict !== "OUI") ? "NON_TRANCHABLE" : "OUI";
  const ec = (Array.isArray(o.ecarts) ? o.ecarts : []).concat(c.filter(x => x.verdict === "NON").map(x => x.critere));
  return { verdict: v, criteres: c, ecarts: [...new Set(ec.filter(Boolean))] };
}

async function run(t, conv) {
  t.status = "en_cours"; t.err = ""; t.pProvider = null; t.vProvider = null; save(); render();
  try {
    if (!t.result) {
      t.step = "Production"; save(); render();
      const persona = localStorage.getItem("nexus_persona") || "";
      const past = conv.messages.filter(x => x.id !== t.id && x.result).slice(-5);
      const hist = past.map(x => `Utilisateur: ${x.demande}\nIA: ${x.result}`).join('\n---\n');
      let promptP = persona ? `[INSTRUCTION SYSTÈME: ${persona}]\n\n` : "";
      promptP += hist ? `Historique:\n${hist}\n\nDemande:\n${t.demande}` : t.demande;
      t.result = await ask(t, "Producteur", promptP, t.tier, false, t.image);
      save(); render();
    }
    if (t.verif) {
      while (t.round < 3) {
        t.step = "Vérification (" + (t.round + 1) + ")"; save(); render();
        const v = await verifier(t); t.round++; t.v = v;
        if (v.verdict !== "NON" || t.round >= 3) break;
        t.step = "Correction"; save(); render();
        t.result = await ask(t, "Correcteur", "Corrige ces écarts :\n" + v.ecarts.join("\n- ") + "\n\nRéponse :\n" + t.result, t.tier, false, null);
        save(); render();
      }
    }
    t.status = "fini";
  } catch(e) {
    if (e.name === 'AbortError' || (e.message && e.message.includes('AbortError'))) {
      t.status = "interrompue"; t.err = "Génération annulée.";
    } else {
      t.status = "erreur"; t.err = e.message || "Erreur";
    }
  }
  save(); render();
}

function setBusy(b) {
  busy = b;
  $("#sendBtn").style.display = b ? "none" : "grid";
  $("#stopBtn").style.display = b ? "grid" : "none";
}
function stopGeneration() { if (currentController) currentController.abort(); }

function start() {
  const d = $("#q").value.trim();
  if ((!d && !pendingImage) || busy) return;
  if (isListening) try { recognition.stop(); } catch(e) {}
  const conv = state.convs.find(c => c.id === state.currentId); if (!conv) return;
  if (conv.messages.length === 0) conv.title = d ? (d.slice(0, 30) + (d.length > 30 ? "..." : "")) : "Image";
  const r = route(d || "Analyse image");
  const t = { id: Date.now(), demande: d || "Analyse de l'image", mode: $("#mo").value, verif: $("#vf").checked, type: r.type, tier: r.tier, status: "en_cours", round: 0, image: pendingImage };
  conv.messages.push(t);
  $("#q").value = ""; $("#q").style.height = "24px";
  removeAttachment();
  currentController = new AbortController();
  setBusy(true);
  run(t, conv).finally(() => { setBusy(false); currentController = null; });
}

function regenerate(id) {
  const conv = state.convs.find(c => c.id === state.currentId);
  const index = conv.messages.findIndex(x => x.id === id);
  if (index === -1 || busy) return;
  conv.messages = conv.messages.slice(0, index + 1);
  const t = conv.messages[index];
  t.result = null; t.v = null; t.log = []; t.round = 0; t.status = "en_cours"; t.pProvider = null; t.vProvider = null;
  save(); render();
  currentController = new AbortController();
  setBusy(true);
  run(t, conv).finally(() => { setBusy(false); currentController = null; });
}

function resume(id) {
  const conv = state.convs.find(c => c.id === state.currentId); if (!conv || busy) return;
  const t = conv.messages.find(x => x.id === id);
  if (t) {
    currentController = new AbortController();
    setBusy(true);
    run(t, conv).finally(() => { setBusy(false); currentController = null; });
  }
}

function copyMsg(id) {
  const conv = state.convs.find(c => c.id === state.currentId);
  const t = conv.messages.find(x => x.id === id);
  if (t && t.result) navigator.clipboard.writeText(t.result).then(() => showToast("✓ Copié")).catch(() => showToast("❌ Erreur"));
}

function niveau(t) {
  if (!t.verif || !t.v) return ["Non vérifié", ""];
  if (t.v.verdict === "OUI") return ["Vérifié", "ok"];
  if (t.v.verdict === "NON_TRANCHABLE") return ["Partiel", "wa"];
  return ["Écart détecté", "ko"];
}

function providerLabel(p) {
  if (!p) return "";
  if (p === "puter") return "PUTER";
  if (p === "keyless") return "KEYLESS";
  if (p === "keyless-fallback") return "KEYLESS ↺";
  if (p === "custom-p" || p === "custom-v") return "API";
  return p.toUpperCase();
}
function providerClass(p) {
  if (!p) return "";
  if (p.startsWith("puter")) return "puter";
  if (p.startsWith("keyless")) return "keyless";
  return "";
}

function renderSidebar() {
  const query = ($("#searchInput") ? $("#searchInput").value : "").toLowerCase();
  const filtered = state.convs.filter(c => c.title.toLowerCase().includes(query));
  $("#convList").innerHTML = filtered.map(c => `
    <div class="conv-item ${c.id === state.currentId ? 'active' : ''}" onclick="switchConversation(${c.id})" ondblclick="renameConversation(${c.id}, event)">
      <div class="conv-title">${esc(c.title)}</div>
      <button class="btn-delete" onclick="deleteConversation(${c.id}, event)" title="Supprimer">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>
    </div>
  `).join("");
}

function render() {
  renderSidebar();
  const chat = $("#chat");
  const conv = state.convs.find(c => c.id === state.currentId);
  
  if (!conv || conv.messages.length === 0) {
    chat.innerHTML = `<div class="empty-state">
      <div class="logo-big">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><circle cx="19" cy="5" r="2"></circle><circle cx="5" cy="19" r="2"></circle><path d="M14.5 10.5L17.5 7M9.5 13.5L6.5 17M9.5 10.5L6.5 7M14.5 13.5L17.5 17"></path></svg>
      </div>
      <h2>// NEXUS WORKSTATION</h2>
      <p>Système de production et vérification par IA.</p>
      <div class="suggestions">
        <button onclick="useSuggestion('Qui es-tu ?')">Qui es-tu ?</button>
        <button onclick="useSuggestion('Explique-moi les trous noirs simplement.')">Trous noirs</button>
        <button onclick="useSuggestion('Rédige un mail professionnel pour demander une augmentation.')">Rédige un mail</button>
      </div>
    </div>`;
    return;
  }

  const isScrolledToBottom = chat.scrollHeight - chat.clientHeight <= chat.scrollTop + 100;
  let h = "";
  
  conv.messages.forEach((t, i) => {
    h += '<div class="msg user">';
    h += '<div class="meta">// query · ' + new Date(t.id).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'}) + '</div>';
    h += '<div class="bubble">' + esc(t.demande);
    if (t.image) h += '<img src="' + t.image + '" class="msg-img" alt="Image">';
    h += '</div></div>';
    
    if (t.status === "erreur") {
      h += '<div class="msg ai"><div class="bubble">';
      h += '<div class="ai-header"><div class="ai-header-left"><span class="ai-model">◆ NEXUS</span></div></div>';
      h += '<div class="ai-body"><div class="msg-system err">❌ ' + esc(t.err) + '</div>';
      h += '<button class="btn-regenerate" onclick="resume(' + t.id + ')">Réessayer</button></div></div></div>';
    } else if (t.status === "interrompue") {
      h += '<div class="msg ai"><div class="bubble">';
      h += '<div class="ai-header"><div class="ai-header-left"><span class="ai-model">◆ NEXUS</span></div></div>';
      h += '<div class="ai-body"><div class="msg-system wa">⚠ Tâche interrompue</div>';
      h += '<div class="msg-actions" style="margin-top:8px"><button onclick="resume(' + t.id + ')">↻ Reprendre</button></div></div></div></div>';
    } else if (t.status === "en_cours" || t.result) {
      h += '<div class="msg ai"><div class="bubble">';
      
      const n = t.verif && t.v ? niveau(t) : null;
      h += '<div class="ai-header"><div class="ai-header-left">';
      h += '<span class="ai-model">◆ NEXUS</span>';
      if (t.pProvider) h += '<span class="provider-tag ' + providerClass(t.pProvider) + '">' + providerLabel(t.pProvider) + '</span>';
      if (n) h += '<span>' + esc(n[0]) + '</span>';
      if (t.step && t.status === "en_cours") h += '<span style="color:var(--primary)">' + esc(t.step) + '</span>';
      h += '</div>';
      h += '<span>' + new Date(t.id).toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'}) + '</span>';
      h += '</div>';
      
      h += '<div class="ai-body">';
      if (t.status === "en_cours" && !t.result) {
        h += '<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
      } else {
        h += formatMarkdown(t.result || "");
      }
      h += '</div>';
      
      if (t.verif && t.v) {
        const verifClass = t.v.verdict === "OUI" ? "ok" : t.v.verdict === "NON_TRANCHABLE" ? "wa" : "ko";
        h += '<div class="verif ' + verifClass + '">';
        h += '<div class="verif-status">';
        h += t.v.verdict === "OUI" ? "✓ Vérifié" : t.v.verdict === "NON_TRANCHABLE" ? "◐ Vérification partielle" : "✗ Écarts détectés";
        if (t.vProvider) h += '<span class="provider-tag ' + providerClass(t.vProvider) + '">' + providerLabel(t.vProvider) + '</span>';
        h += '</div>';
        if (t.v.ecarts && t.v.ecarts.length) {
          h += '<div class="verif-errors">⚠ ' + t.v.ecarts.map(esc).join(" · ") + '</div>';
        }
        if (t.v.criteres && t.v.criteres.length) {
          h += '<details><summary>Voir les ' + t.v.criteres.length + ' critères analysés</summary>';
          h += t.v.criteres.map(c => '<div class="verif-detail-item"><b>' + esc(c.verdict) + '</b> : ' + esc(c.critere) + '</div>').join("");
          h += '</details>';
        }
        h += '</div>';
      }
      
      h += '<div class="msg-actions" style="padding: 0 14px 12px;">';
      if (t.result) h += '<button onclick="copyMsg(' + t.id + ')">📋 <span>Copier</span></button>';
      if (t.status === "fini" && i === conv.messages.length - 1) {
        h += '<button onclick="regenerate(' + t.id + ')">↻ <span>Régénérer</span></button>';
      }
      h += '</div>';
      
      h += '</div></div>';
    }
  });
  
  chat.innerHTML = h;
  if (isScrolledToBottom) chat.scrollTop = chat.scrollHeight;
}

function useSuggestion(text) {
  $("#q").value = text;
  $("#q").focus();
  $("#q").style.height = '24px';
  $("#q").style.height = Math.min($("#q").scrollHeight, 120) + 'px';
}

$("#persona").addEventListener("input", function() { localStorage.setItem("nexus_persona", this.value.trim()); });
$("#q").addEventListener("input", function() { this.style.height = '24px'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });
$("#q").addEventListener("keydown", function(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); start(); } });
document.addEventListener('keydown', function(e) { 
  if (e.key === 'Escape') { 
    $("#sidebar").classList.remove("open"); 
    $("#overlay").classList.remove("open"); 
  } 
});

updateThemeIcon();
load(); render(); fillS(); toggleSettings();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#e6e2ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXUS AI">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>NEXUS AI</title>
<style>
:root{
  --tx:#2b2340;
  --dm:#8a7fb0;
  --er:#e0445a;
  --brand:#7c5cff;
  --brand2:#c86bff;
  --bg1:#e6e2ff;
  --bg2:#f0efff;
  --bg3:#d9e8ff;
  --soft:#f8f6ff;
  --line:rgba(120,90,220,.12);
  --bar-space:clamp(74px, 11vh, 92px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  min-height:100%;
  min-height:100dvh;
  background:var(--bg1);
  color:var(--tx);
  font:clamp(15px, 4vw, 16px)/1.45 -apple-system,system-ui,'Segoe UI',sans-serif;
  overscroll-behavior:none;
}
#app{
  position:fixed;
  inset:0;
  height:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 38%,var(--bg1) 75%,var(--bg2) 100%);
  padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
#app::before{
  content:'';
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:max(12px,env(safe-area-inset-top));
  background:var(--bg1);
  z-index:0;
  pointer-events:none;
}

/* ===== EN-TETE ===== */
header{
  position:fixed;
  top:calc(env(safe-area-inset-top) + clamp(8px, 1.5vh, 14px));
  left:0;
  right:0;
  z-index:60;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 calc(clamp(12px, 4vw, 18px) + env(safe-area-inset-right)) 0 calc(clamp(12px, 4vw, 18px) + env(safe-area-inset-left));
  background:transparent;
  border:0;
  min-height:48px;
  pointer-events:none;
}
header>*{pointer-events:auto}
header>button{
  width:clamp(34px, 9vw, 38px);
  height:clamp(34px, 9vw, 38px);
  flex-shrink:0;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(139,92,255,.16),rgba(200,107,255,.16));
  border:1px solid rgba(139,92,255,.18);
  color:var(--brand);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 24px rgba(60,30,140,.18);
  touch-action:manipulation;
}
.head-center{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:44px;
  background:transparent;
  cursor:pointer;
}
.logo{
  width:clamp(30px, 8vw, 36px);
  height:clamp(30px, 8vw, 36px);
  object-fit:contain;
  display:block;
  flex-shrink:0;
  background:transparent;
}
.head-text{display:flex;flex-direction:column;align-items:flex-start;gap:0;line-height:1}
.head-title{
  font-family:Georgia,'Times New Roman',serif;
  font-size:clamp(18px, 5vw, 21px);
  letter-spacing:2px;
  color:var(--tx);
  line-height:1;
  white-space:nowrap;
}
.head-sub{font-size:10px;color:var(--dm);white-space:nowrap;margin-top:2px}

/* ===== VUES & CHAT ===== */
main{
  flex:1;
  min-height:0;
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.v{
  display:none;
  flex:1;
  min-height:0;
  flex-direction:column;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + clamp(64px, 10vh, 78px)) clamp(12px, 3.8vw, 18px) calc(20px + env(safe-area-inset-bottom));
}
.v.on{display:flex}
#v-chat{padding:0 clamp(12px, 3.8vw, 18px) 0;overflow:hidden}
#msgs{
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  display:flex;
  flex-direction:column;
  gap:clamp(10px, 2vh, 14px);
  padding:calc(env(safe-area-inset-top) + clamp(64px, 10vh, 78px)) 0 calc(var(--bar-space) + env(safe-area-inset-bottom));
}
#v-chat.hf #msgs{padding-bottom:calc(var(--bar-space) + 36px + env(safe-area-inset-bottom))}

.m{max-width:min(88%, 680px);display:flex;flex-direction:column}
.m.user{align-self:flex-end}
.bb{
  padding:clamp(10px, 2.8vw, 13px) clamp(12px, 3.5vw, 15px);
  border-radius:20px;
  line-height:1.5;
  font-size:clamp(14px, 3.9vw, 15.5px);
  word-wrap:break-word;
  overflow-wrap:anywhere;
  user-select:text;
  -webkit-user-select:text;
  box-shadow:0 2px 10px rgba(120,90,220,.08);
}
.user .bb{background:#eef2ff;color:var(--tx);border:1px solid rgba(120,90,220,.10)}
.ai .bb{background:#e9e2ff;color:#5b4a8a;border:1px solid rgba(120,90,220,.10)}
pre{background:var(--tx);color:#fff;padding:10px;border-radius:10px;overflow-x:auto;font-size:13px;margin:8px 0}
code{font-family:Menlo,monospace;font-size:13px;background:var(--line);padding:1px 5px;border-radius:5px}
pre code{background:none;padding:0}
a{color:var(--brand)}
.mt{font-size:11px;color:var(--dm);margin:6px 4px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mt button{background:none;border:0;font-size:13px;padding:2px 4px;color:var(--dm);cursor:pointer}
.mt button[data-a="sv"]{font-size:12px;border:1px solid rgba(120,90,220,.20);border-radius:10px;padding:3px 8px;background:var(--soft);color:#6b5aa8}
.mt .who{display:inline-flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.04em;color:var(--dm)}
.mt .av{width:24px;height:24px;object-fit:contain}
.mt button.on{background:rgba(124,92,255,.14);border-radius:10px;color:var(--brand)}
.mt button.on.bad{background:rgba(224,68,90,.14);color:var(--er)}

/* ===== ACCUEIL & SUGGESTIONS ===== */
.wel{
  position:relative;
  text-align:center;
  color:var(--dm);
  padding:clamp(18px, 4.5vh, 40px) clamp(8px, 2.5vw, 14px);
  overflow:hidden;
}
.wel>*{position:relative;z-index:1}
.wel .bgav{position:absolute;inset:0;z-index:0;pointer-events:none}
.bgav img{position:absolute;width:clamp(64px, 20vw, 96px);opacity:.14;animation:drift 14s ease-in-out infinite}
.bgav img:nth-child(1){left:2%;top:6%}
.bgav img:nth-child(2){right:0;top:38%;width:clamp(84px, 26vw, 120px);animation-delay:-5s}
.bgav img:nth-child(3){left:18%;bottom:0;width:clamp(54px, 16vw, 72px);animation-delay:-9s}
@keyframes drift{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(14px,-18px) rotate(5deg)}}

.sugs{
  display:flex;
  flex-direction:column;
  gap:clamp(6px, 1.3vh, 9px);
  margin-top:clamp(12px, 2.5vh, 18px);
  transition:opacity .35s;
}
.sugs.out{opacity:0}
.sug{
  width:100%;
  min-height:42px;
  padding:clamp(9px, 1.6vh, 12px) clamp(12px, 3.5vw, 16px);
  border-radius:14px;
  border:1px solid rgba(120,90,220,.15);
  background:#fff;
  color:#5b4a8a;
  font-size:clamp(13px, 3.7vw, 14.5px);
  line-height:1.35;
  cursor:pointer;
  touch-action:manipulation;
  box-shadow:0 2px 10px rgba(120,90,220,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.sug .mini{width:22px;height:22px;flex-shrink:0;object-fit:contain}
.sug.fl{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.bgav img,.sug.fl{animation:none}}

/* ===== BARRE DU BAS ===== */
#bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  display:flex;
  gap:clamp(7px, 2vw, 10px);
  align-items:center;
  padding:8px calc(clamp(10px, 3vw, 14px) + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(clamp(10px, 3vw, 14px) + env(safe-area-inset-left));
  background:transparent;
  border:0;
  pointer-events:none;
  touch-action:manipulation;
}
#bar>*{pointer-events:auto}
#bar.hf>#nw,#bar.hf>#sb{align-self:flex-end}

#nw,#sb{
  width:clamp(40px, 11vw, 44px);
  height:clamp(40px, 11vw, 44px);
  flex-shrink:0;
  border-radius:50%;
  background:linear-gradient(135deg,rgba(139,92,255,.16),rgba(200,107,255,.16));
  border:1px solid rgba(139,92,255,.18);
  color:var(--brand);
  box-shadow:0 8px 24px rgba(60,30,140,.18);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  font-size:0;
  cursor:pointer;
  touch-action:manipulation;
}
#nw svg,#sb svg{display:block}
#sb:disabled{opacity:.45;box-shadow:none;cursor:default}

#inwrap{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(120,90,220,.15);
  border-radius:24px;
  box-shadow:0 8px 24px rgba(60,30,140,.18);
}
#inrow{display:flex;align-items:center;min-width:0;padding-right:4px}
#in{
  flex:1;
  min-width:0;
  background:transparent;
  border:0;
  border-radius:22px;
  color:var(--tx);
  padding:10px 10px 10px 14px;
  font:inherit;
  font-size:16px;
  resize:none;
  max-height:clamp(88px, 18vh, 120px);
  outline:0;
  box-shadow:none;
  -webkit-user-select:text;
  user-select:text;
}
#mic,#att{
  width:32px;
  height:32px;
  flex-shrink:0;
  border-radius:50%;
  background:transparent;
  border:0;
  color:#a8a0c8;
  cursor:pointer;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  touch-action:manipulation;
}
#mic svg,#att svg{width:20px;height:20px;display:block}
#mic.on{background:rgba(239,68,68,.12);color:#ef4444}

#fchip{
  display:none;
  align-items:center;
  gap:6px;
  margin:8px 8px 0 10px;
  padding:4px 4px 4px 10px;
  border-radius:14px;
  background:#efe9ff;
  color:#5b4a8a;
  font-size:12px;
  min-width:0;
}
#fth{display:none;width:34px;height:34px;object-fit:cover;border-radius:8px;flex-shrink:0}
#fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#focr{
  height:24px;
  flex-shrink:0;
  border-radius:12px;
  border:0;
  background:rgba(124,92,255,.15);
  color:var(--brand);
  font-size:12px;
  font-weight:700;
  padding:0 8px;
  cursor:pointer;
  display:none;
}
#fx{
  width:24px;
  height:24px;
  flex-shrink:0;
  border-radius:50%;
  border:0;
  background:rgba(124,92,255,.15);
  color:var(--brand);
  font-size:12px;
  line-height:1;
  cursor:pointer;
  padding:0;
  touch-action:manipulation;
}

/* ===== CONTENUS RICHES, HISTORIQUE, REGLAGES & MODALES ===== */
.tb{overflow-x:auto;margin:6px 0}
.tb table{border-collapse:collapse;font-size:13px;width:100%}
.tb th,.tb td{border:1px solid rgba(120,90,220,.25);padding:4px 8px;text-align:left}
.tb th{background:rgba(120,90,220,.10)}
.bq{display:block;border-left:3px solid #c9bdf5;padding-left:8px;color:#6b5aa8}
.bb hr{border:0;border-top:1px solid rgba(120,90,220,.25);margin:8px 0}
.gimg{max-width:100%;border-radius:12px;display:block;margin-top:8px;cursor:zoom-in}
.ath{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--dm)}
.ath .th{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.ath .fi{width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px}
.card .cbtn{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.card button,.clist button{border:1px solid rgba(120,90,220,.25);background:#fff;color:#5b4a8a;border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer;touch-action:manipulation}
.card .cbtn button:first-child{background:linear-gradient(135deg,#8b5cff,var(--brand2));color:#fff;border:0}
.clist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.clist button{text-align:left}

#stock{margin-top:22px}
.stock-title{font-size:16px;font-weight:700;color:var(--tx);margin:0 0 4px}
.stock-card{background:#fff;border:1px solid rgba(120,90,220,.10);border-radius:12px;padding:12px;margin-bottom:8px}
.stock-actions{display:flex;gap:8px;margin-top:8px}
.stock-actions button{background:var(--soft);border:1px solid rgba(120,90,220,.15);border-radius:10px;padding:6px 10px;font-size:12px;color:#6b5aa8;cursor:pointer}

#q{width:100%;background:#fff;border:1px solid rgba(120,90,220,.15);border-radius:12px;padding:11px;color:var(--tx);font-size:16px;margin:0 0 12px;outline:0}
.sw{display:flex;align-items:center;gap:8px}
.sw input{width:22px;height:22px}
.h{font-size:12px;color:var(--dm);margin-top:6px;word-break:break-word}
.b2{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--tx);cursor:pointer}
.b2.r{color:#ef4444}
.hi{display:flex;gap:8px;align-items:center;padding:12px;border:1px solid rgba(120,90,220,.10);border-radius:12px;margin-bottom:8px;background:#fff}
.hi div{flex:1;min-width:0}
.hi small{color:var(--dm)}
.ib{width:38px;height:38px;border-radius:50%;background:#f1efff;border:1px solid rgba(120,90,220,.10);font-size:16px;color:var(--dm);cursor:pointer;flex-shrink:0}
textarea#rep{width:100%;height:90px;margin-top:8px;background:var(--soft);color:var(--dm);border:1px solid var(--line);border-radius:10px;font-size:11px}

.set-card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(120,90,220,.08);border:1px solid rgba(120,90,220,.08)}
.set-title{font-size:18px;font-weight:700;color:var(--tx);margin:0 0 4px}
.set-sub{font-size:13px;font-weight:700;color:var(--tx);margin:16px 0 8px}
.set-sub:first-of-type{margin-top:10px}
.set-note{font-size:12px;color:var(--dm);line-height:1.4;margin:6px 0}
.set-line{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0edff;flex-wrap:wrap}
.set-line:last-child{border-bottom:0}
.set-line b{flex:1;font-size:14px}
.set-line input[type=password],.set-line input[type=text],.set-line select{width:100%;order:10;margin-top:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--tx);font-size:15px}
.set-line .h{width:100%;order:11;margin-top:4px}
.set-badge{font-size:10px;background:#efe9ff;color:var(--brand);border-radius:20px;padding:2px 7px;font-weight:700}
.custom-form{display:flex;flex-direction:column;gap:8px;background:#f8f7ff;border:1px solid rgba(139,92,255,.18);border-radius:14px;padding:12px;margin:10px 0}
.custom-form label{font-size:12px;font-weight:700;color:var(--tx)}
.custom-form input{width:100%;padding:11px 10px;border-radius:10px;border:1px solid rgba(139,92,255,.25);font-size:14px;background:#fff}
.custom-form input:focus{outline:2px solid rgba(139,92,255,.35);border-color:#8b5cff}
.j-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0edff;cursor:pointer}
.j-row:last-of-type{border-bottom:0}
.j-row b{flex:1;font-size:14px}
.cf-instructions{font-size:11px;background:#f0f4ff;padding:10px;border-radius:8px;margin-top:8px;color:#5b4a8a;line-height:1.4;border:1px solid #d0dfff}
.cf-instructions code{background:#dce6ff;padding:2px 4px;border-radius:4px;font-size:10px;word-break:break-all}

.guide h2{margin:6px 0 10px}
.guide h3{margin:18px 0 6px;color:var(--brand)}
.guide h4{margin:10px 0 2px}
.guide p{margin:0 0 8px;line-height:1.5;font-size:14px;overflow-wrap:anywhere}
.guide a{color:var(--brand)}

#lb{position:fixed;inset:0;z-index:999;background:rgba(10,8,25,.94);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
#lb[hidden]{display:none}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#lb button{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:16px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer}
#ts{position:fixed;bottom:calc(var(--bar-space) + 16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;display:none;z-index:90;max-width:90vw}
#dlmenu{position:fixed;inset:0;z-index:100;background:rgba(43,35,64,.45);display:none;align-items:center;justify-content:center}
#dlbox{background:#fff;border-radius:18px;padding:16px;width:min(86vw,340px);max-height:80vh;overflow-y:auto}
</style>
</head>
<body>
<div id="app">
<header>
  <button type="button" data-v="hist" title="Historique" aria-label="Historique"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
  <div class="head-center on" data-v="chat" title="Retour au chat">
    <img src="logo.png" class="logo" alt="NEXUS">
    <div class="head-text"><div class="head-title">NEXUS AI</div><div class="head-sub" id="stt">4 IA prêtes</div></div>
  </div>
  <button type="button" data-v="set" title="Réglages" aria-label="Réglages"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
</header>
<main>
<section class="v on" id="v-chat">
  <div id="msgs">
    <div style="text-align:center;color:var(--dm);padding:clamp(18px, 4.5vh, 40px) 10px">
      <h2 style="color:var(--tx)">NEXUS AI</h2>
      Je réponds seul aux demandes simples et je ne sollicite une IA que si c'est nécessaire.<br>
      Tapez <b>aide</b> pour voir ce que je sais faire.
      <div class="sugs">
        <button type="button" class="sug" data-q="Quelle heure est-il à Tokyo ?">🕐 Quelle heure est-il à Tokyo ?</button>
        <button type="button" class="sug" data-q="Dans 3 semaines">📅 Dans 3 semaines</button>
        <button type="button" class="sug" data-q="Explique-moi ce qu'est une étoile simplement">🧠 Explique-moi ce qu'est une étoile simplement</button>
      </div>
    </div>
  </div>
</section>
<section class="v" id="v-hist">
  <button type="button" class="b2 on" data-v="chat" style="margin-bottom:10px">← Retour au chat</button>
  <input id="q" aria-label="Rechercher dans l'historique" placeholder="Rechercher dans l'historique…">
  <div id="hl"></div>
  <div id="stock"></div>
</section>
<section class="v" id="v-set"></section>
<section class="v" id="v-guide"></section>
</main>
<div id="bar" style="display:flex;">
  <button type="button" id="nw" title="Nouvelle conversation" aria-label="Nouvelle conversation"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
  <div id="inwrap">
    <div id="fchip"><img id="fth" alt=""><span id="fname"></span><button type="button" id="focr" title="Lire le texte de l'image (gratuit)">Aa</button><button type="button" id="fx" title="Retirer le fichier">✕</button></div>
    <div id="inrow">
      <textarea id="in" rows="1" placeholder="Demandez à NEXUS..." enterkeyhint="send"></textarea>
      <button type="button" id="mic" title="Parler" aria-label="Parler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg></button>
      <button type="button" id="att" title="Joindre un fichier" aria-label="Joindre un fichier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button>
    </div>
  </div>
  <button type="button" id="sb" aria-label="Envoyer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7z"></path></svg></button>
</div>
<input type="file" id="attfile" style="display:none">
</div>
<div id="lb" hidden><img alt=""><button type="button" aria-label="Fermer">✕</button></div>
<div id="ts"></div>
<div id="dlmenu"><div id="dlbox"></div></div>
<script async src="https://js.puter.com/v2/"></script>
<script type="module" src="app.js"></script>
</body>

  <style>
    @font-face {

    :root {

    * { box-sizing: border-box; }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }

    #app { display: flex; height: var(--app-height); overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: 280px;
      min-width: 280px;
      background: #0e0e15;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .side-head { padding: 16px; border-bottom: 1px solid var(--border); }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: 0.04em; }
    .logo span { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
    .side-actions { display: flex; gap: 8px; margin-top: 12px; }

    #convList { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

      padding: 10px 12px;

    .conv-item small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
    .conv-del { background: none; border: none; color: var(--muted); font-size: 16px; padding: 2px 6px; }
    .side-foot { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .side-foot button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-2); color: var(--text); font-size: 13px; }

    /* Main */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

      display: flex;

    .empty h2 { color: var(--text); margin: 0 0 8px; font-size: 26px; }
    .msg { max-width: 82%; padding: 12px 14px; border-radius: 16px; line-height: 1.55; white-space: normal; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 6px; }
    .msg.assistant { align-self: flex-start; background: var(--bg-2); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
    .msg.system { align-self: center; background: #2a2110; border: 1px solid #4a3a12; color: #ffe9a8; font-size: 13px; max-width: 92%; }
    .msg img { max-width: 100%; border-radius: 10px; display: block; margin-top: 8px; }
    .msg pre { background: #0a0a10; border: 1px solid var(--border); padding: 12px; border-radius: 10px; overflow-x: auto; font-size: 13px; }
    .msg code { background: rgba(255, 255, 255, 0.08); padding: 2px 6px; border-radius: 6px; font-size: 13px; }
    .msg pre code { background: none; padding: 0; }
    .msg-actions { display: flex; gap: 8px; margin-top: 8px; }
    .msg-actions button { background: var(--bg-3); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 5px 10px; font-size: 12px; }
    .typing { color: var(--muted); font-style: italic; }

    #suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 18px 0; }
    #suggestions button {
      background: var(--bg-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 12px;

    #inputArea {
      padding: 14px 18px 18px;
      border-top: 1px solid var(--border);
      background: #0e0e15;
    }
    #preview { display: none; margin-bottom: 10px; }
    #preview img { max-width: 120px; max-height: 120px; border-radius: 10px; border: 1px solid var(--border); }
    .input-row { display: flex; gap: 10px; align-items: flex-end; }
    #promptInput {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: var(--text);

    }
    .icon-btn {
      width: 48px; height: 48px;
      border-radius: 14px;
      border: 1px solid var(--border);

    }
    #sendBtn { background: var(--accent); border-color: var(--accent); font-size: 18px; }
    #stopBtn { display: none; background: #ff3b30; border-color: #ff3b30; }
    .input-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .input-foot label { display: flex; align-items: center; gap: 6px; }

    @media (max-width: 820px) {
      #sidebar { display: none; }
      #sidebar.open { display: flex; position: fixed; inset: 0 auto 0 0; z-index: 20; width: 86vw; }
      .msg { max-width: 92%; }
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f4f4f7; --bg-2: #ffffff; --bg-3: #ececf1; --text: #111118; --muted: #6b6b7a; --border: #e2e2ea; }
      #sidebar, #inputArea, #topbar { background: #fff; }
      .msg.assistant { background: #fff; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Sidebar : conversations -->
    <aside id="sidebar">

      </div>
      <div id="convList"><button class="conv-item active"><span><strong>Nouvelle conversation</strong><small>Vide</small></span><span class="conv-del" data-del="c_mwmjkw3r_bcyi">×</span></button></div>
      <div class="side-foot">
        <button id="exportBtn">Exporter</button>
        <button id="clearBtn">Tout effacer</button>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">
      <header id="topbar">
        <div>
          <h1>NEXUS AI</h1>
          <p>Vérification croisée par IA</p>
        </div>
        <div class="top-controls">
          <button id="toggleSidebarBtn" class="icon-btn" style="width:38px;height:38px;font-size:16px;">☰</button>
          <select id="mo" title="Mode">
            <option value="puter">Puter</option>

            <option value="complex">Complexe</option>

        </div>

      <div id="chat"><div class="empty"><h2>Bonjour, c'est NEXUS AI</h2><p>Vérification croisée, correction et comparaison. Pose ta question ou colle un texte.</p></div></div>

        <button data-suggest="Vérifie cette info : ">Vérifie cette info</button>

  <script>
    /* ============================= */
    /* Utilitaires                   */
    /* ============================= */
    const $ = (sel) => document.querySelector(sel);

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[c]));
    }

    function formatMarkdown(text) {
      let safe = esc(String(text ?? ""));
      const blocks = [];
      // Blocs de code ```lang ... ```
      safe = safe.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
        blocks.push('<pre><code>' + code + '</code></pre>');
        return '\u0000BLOCK' + (blocks.length - 1) + '\u0000';
      });
      // Code inline `code`
      safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Gras **texte**
      safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      // Italique *texte*
      safe = safe.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      // Titres
      safe = safe.replace(/^### (.*)$/gm, '<h3>$1</h3>');
      safe = safe.replace(/^## (.*)$/gm, '<h2>$1</h2>');
      safe = safe.replace(/^# (.*)$/gm, '<h1>$1</h1>');
      // Listes
      safe = safe.replace(/^- (.*)$/gm, '<li>$1</li>');
      // Liens [texte](url)
      safe = safe.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      // Sauts de ligne
      safe = safe.replace(/\n/g, '<br>');
      // Restaure les blocs de code
      safe = safe.replace(/\u0000BLOCK(\d+)\u0000/g, (m, i) => blocks[Number(i)] || '');
      return safe;
    }

    /* ============================= */
    /* Modèles Puter                 */
    /* ============================= */
    const PUTER_MODELS = {
      complex: ["gpt-5.4", "claude-sonnet-4-5", "gemini-2.5-pro"],
      simple: ["gpt-5.4-nano", "claude-sonnet-4-5", "gemini-2.5-flash"],
      vision: ["gpt-5.4", "claude-sonnet-4-5", "gemini-2.5-pro"]
    };

    function extractPuterText(res) {
      if (!res) return "";
      if (typeof res === "string") return res;
      if (res.message) {
        const c = res.message.content;
        if (typeof c === "string") return c;
        if (Array.isArray(c)) {
          return c.map((part) => {
            if (typeof part === "string") return part;
            return part.text || part.content || "";
          }).join("");
        }
      }
      if (typeof res.text === "string") return res.text;
      if (res.choices && res.choices[0] && res.choices[0].message) {
        return res.choices[0].message.content || "";
      }
      if (res.content) return res.content;
      return "";
    }

    async function callPuter(input, signal, image = null, tier = "complex") {
      if (!window.puter || !puter.ai) {
        throw new Error("Puter n'est pas encore chargé. Attends 2 secondes et réessaie.");
      }
      const candidates = image ? PUTER_MODELS.vision : (PUTER_MODELS[tier] || PUTER_MODELS.complex);
      const chatPromise = (async () => {
        let lastErr = null;
        for (const model of candidates) {
          try {
            const opts = signal ? { model, signal } : { model };
            let res;
            if (image) {
              const promptText = typeof input === "string"
                ? input
                : (Array.isArray(input) ? input.map((m) => m.content).join("\n") : String(input));
              res = await puter.ai.chat(promptText, image, false, opts);
            } else {
              res = await puter.ai.chat(input, false, opts);
            }
            return extractPuterText(res);
          } catch (e) {
            lastErr = e;
            console.warn("Modèle en échec, tentative suivante :", model, e);
          }
        }
        throw new Error("Tous les modèles Puter ont échoué : " + (lastErr && lastErr.message ? lastErr.message : lastErr));
      })();
      return chatPromise;
    }

    /* ============================= */
    /* État / Conversations          */
    /* ============================= */
    let conversations = [];
    try {
      conversations = JSON.parse(localStorage.getItem("nexus_convs") || "[]");
    } catch (e) {
      conversations = [];
    }
    let currentId = localStorage.getItem("nexus_current") || null;
    let abortController = null;
    let isGenerating = false;
    let pendingImage = null;
    let pendingImageName = "";

    function save() {
      localStorage.setItem("nexus_convs", JSON.stringify(conversations));
      if (currentId) localStorage.setItem("nexus_current", currentId);
    }

    function getCurrent() {
      return conversations.find((c) => c.id === currentId);
    }

    function newConv() {
      const conv = {
        id: "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 6),
        title: "Nouvelle conversation",
        createdAt: Date.now(),
        messages: []
      };
      conversations.unshift(conv);
      currentId = conv.id;
      save();
      renderSidebar();
      render();
      $("#promptInput").focus();
      return conv;
    }

    function renderSidebar() {
      const q = ($("#searchInput").value || "").toLowerCase();
      const list = $("#convList");
      list.innerHTML = "";
      const filtered = conversations.filter((c) => {
        if (!q) return true;
        return (c.title || "").toLowerCase().includes(q) ||
          c.messages.some((m) => (m.content || "").toLowerCase().includes(q));
      });
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty" style="padding:16px;">Aucune conversation.</div>';
        return;
      }
      filtered.forEach((c) => {
        const btn = document.createElement("button");
        btn.className = "conv-item" + (c.id === currentId ? " active" : "");
        const last = c.messages[c.messages.length - 1];
        btn.innerHTML = '<span><strong>' + esc(c.title || "Conversation") + '</strong><small>' + esc(last ? String(last.content || "").slice(0, 60) : "Vide") + '</small></span><span class="conv-del" data-del="' + c.id + '">×</span>';
        btn.addEventListener("click", (e) => {
          const del = e.target.closest("[data-del]");
          if (del) {
            e.stopPropagation();
            conversations = conversations.filter((x) => x.id !== c.id);
            if (currentId === c.id) currentId = conversations[0] ? conversations[0].id : null;
            save();
            renderSidebar();
            render();
            return;
          }
          currentId = c.id;
          save();
          renderSidebar();
          render();
        });
        list.appendChild(btn);
      });
    }

    function render() {
      const chat = $("#chat");
      const conv = getCurrent();
      chat.innerHTML = "";
      if (!conv) {
        chat.innerHTML = '<div class="empty"><h2>Bonjour, c\'est NEXUS AI</h2><p>Vérification croisée, correction et comparaison. Pose ta question ou colle un texte.</p></div>';
        return;
      }
      if (conv.messages.length === 0) {
        chat.innerHTML = '<div class="empty"><h2>Bonjour, c\'est NEXUS AI</h2><p>Vérification croisée, correction et comparaison. Pose ta question ou colle un texte.</p></div>';
        return;
      }
      conv.messages.forEach((m) => {
        const div = document.createElement("div");
        div.className = "msg " + (m.role === "user" ? "user" : m.role === "system" ? "system" : "assistant");
        if (m.role === "user") {
          div.innerHTML = esc(m.content || "");
          if (m.image) {
            const img = document.createElement("img");
            img.src = m.image;
            img.alt = "Image jointe";
            div.appendChild(img);
          }
        } else {
          div.innerHTML = formatMarkdown(m.content || "");
          const actions = document.createElement("div");
          actions.className = "msg-actions";
          const copyBtn = document.createElement("button");
          copyBtn.textContent = "Copier";
          copyBtn.addEventListener("click", () => navigator.clipboard.writeText(m.content || ""));
          const speakBtn = document.createElement("button");
          speakBtn.textContent = "Écouter";
          speakBtn.addEventListener("click", () => speak(m.content || ""));
          actions.append(copyBtn, speakBtn);
          div.appendChild(actions);
        }
        chat.appendChild(div);
      });
      chat.scrollTop = chat.scrollHeight;
    }

    function addMsg(role, content, image) {
      let conv = getCurrent();
      if (!conv) conv = newConv();
      const msg = { role, content, image: image || null, at: Date.now() };
      conv.messages.push(msg);
      if (conv.messages.length === 1 && role === "user") {
        conv.title = String(content || "").slice(0, 42) || "Conversation";
      }
      save();
      renderSidebar();
      render();
      return msg;
    }

    /* ============================= */
    /* Voix                          */
    /* ============================= */
    function loadVoices() {
      const sel = $("#voiceSelect");
      if (!("speechSynthesis" in window)) return;
      const voices = window.speechSynthesis.getVoices();
      sel.innerHTML = "";
      voices.filter((v) => v.lang && v.lang.toLowerCase().startsWith("fr")).forEach((v) => {
        const opt = document.createElement("option");
        opt.value = v.name;
        opt.textContent = v.name + " (" + v.lang + ")";
        sel.appendChild(opt);
      });
      if (sel.options.length === 0) {
        voices.slice(0, 10).forEach((v) => {
          const opt = document.createElement("option");
          opt.value = v.name;
          opt.textContent = v.name + " (" + v.lang + ")";
          sel.appendChild(opt);
        });
      }
    }
    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text || "").slice(0, 2000));
      u.lang = "fr-FR";
      const name = $("#voiceSelect").value;
      const v = window.speechSynthesis.getVoices().find((x) => x.name === name);
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    }

    /* ============================= */
    /* Envoi / Run                   */
    /* ============================= */
    function setGenerating(on) {
      isGenerating = on;
      $("#sendBtn").style.display = on ? "none" : "";
      $("#stopBtn").style.display = on ? "" : "none";
      $("#statusText").textContent = on ? "NEXUS réfléchit..." : "";
    }

    async function run() {
      const inputEl = $("#promptInput");
      const text = (inputEl.value || "").trim();
      const mode = $("#mo").value;
      const tier = $("#tier").value || "complex";
      if (!text && !pendingImage) return;
      if (isGenerating) return;

      const userContent = text;
      const userImage = pendingImage;
      addMsg("user", userContent, userImage);
      inputEl.value = "";
      inputEl.style.height = "auto";
      pendingImage = null;
      $("#preview").style.display = "none";
      $("#preview").innerHTML = "";

      // Message d'attente
      const conv = getCurrent();
      conv.messages.push({ role: "assistant", content: "⏳ Je vérifie...", at: Date.now() });
      render();
      const typingEl = $("#chat").lastElementChild;

      abortController = new AbortController();
      setGenerating(true);
      try {
        let promptP = "";
        let promptC = "";
        let result = "";

        const systemBlock = "Tu es NEXUS AI, un assistant de vérification croisée. Tu dois être précis, sourcé dans ton raisonnement, nuancé, et signaler clairement ce qui est vérifié, probable, incertain ou faux. Tu réponds en français, de façon structurée.";
        const corrSystem = "Tu es NEXUS AI, un correcteur exigeant. Tu corriges orthographe, grammaire, syntaxe, style et cohérence, sans changer le sens. Tu présentes le texte corrigé, puis la liste des corrections.";

        if (mode === "correction") {

          const msgs = [
            { role: "system", content: corrSystem },
            { role: "user", content: promptC }
          ];
          result = await callPuter(msgs, abortController.signal, userImage, tier);
        } else if (mode === "verification") {
          promptP = "[INSTRUCTIONS SYSTÈME]\n" + systemBlock + "\n\n" +
            "Mission : vérification croisée. Analyse l'affirmation, distingue fait / opinion / rumeur, donne un verdict (Vérifié / Probable / Incertain / Trompeur / Faux), les points de vérification et ce qu'il manque pour trancher.\n\n" +
            "À vérifier :\n" + userContent;
          const msgs = [
            { role: "system", content: systemBlock },
            { role: "user", content: promptP }
          ];
          result = await callPuter(msgs, abortController.signal, userImage, tier);
        } else {
          // Mode Puter par défaut
          const history = (conv.messages || []).slice(0, -1).slice(-10).map((m) => ({
            role: m.role === "user" ? "user" : "assistant",
            content: String(m.content || "").slice(0, 2000)
          }));
          promptP = "[INSTRUCTIONS SYSTÈME]\n" + systemBlock + "\n\n" +
            "Contexte : NEXUS AI aide à vérifier, corriger et comparer. Réponds en français, structuré, avec un verdict clair si c'est une vérification.\n\n" +
            "Question :\n" + userContent;
          const msgs = [
            { role: "system", content: systemBlock },
            ...history,
            { role: "user", content: promptP }
          ];
          result = await callPuter(msgs, abortController.signal, userImage, tier);
        }

        // Remplace le message d'attente
        conv.messages[conv.messages.length - 1] = { role: "assistant", content: result || "Aucune réponse reçue.", at: Date.now() };
        save();
        render();
        if ($("#speakCheck").checked) speak(result);
      } catch (e) {
        if (e && e.name === "AbortError") {
          conv.messages[conv.messages.length - 1] = { role: "assistant", content: "⏹ Génération arrêtée.", at: Date.now() };
        } else {
          conv.messages[conv.messages.length - 1] = { role: "assistant", content: "⚠️ Erreur : " + (e.message || e), at: Date.now() };

        save();
        render();
      } finally {
        setGenerating(false);
        abortController = null;
      }

    $("#promptInput").addEventListener("keydown", (e) => {

    $("#promptInput").addEventListener("input", (e) => {

    $("#stopBtn").addEventListener("click", () => {
      if (abortController) abortController.abort();

    $("#newBtn").addEventListener("click", newConv);

    $("#toggleSidebarBtn").addEventListener("click", () => {

    });
    $("#menuBtn").addEventListener("click", () => {
      $("#sidebar").classList.remove("open");
    });

    $("#searchInput").addEventListener("input", renderSidebar);

    $("#clearBtn").addEventListener("click", () => {

      conversations = [];

      renderSidebar();

    $("#exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(conversations, null, 2)], { type: "application/json" });
      const a = document.createElement("a");

      a.download = "nexus-ai-conversations.json";

      URL.revokeObjectURL(a.href);

    document.querySelectorAll("#suggestions button").forEach((btn) => {
      btn.addEventListener("click", () => {
        $("#promptInput").value = btn.getAttribute("data-suggest") || "";
        $("#promptInput").focus();
      });
    });

    // Pièce jointe : compression image
    $("#attachBtn").addEventListener("click", () => $("#fileInput").click());
    $("#fileInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const max = 1024;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const r = Math.min(max / w, max / h);
            w = Math.round(w * r);
            h = Math.round(h * r);
          }
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          pendingImage = canvas.toDataURL("image/jpeg", 0.82);
          pendingImageName = file.name;
          const prev = $("#preview");
          prev.style.display = "block";
          prev.innerHTML = "";
          const im = document.createElement("img");
          im.src = pendingImage;
          im.alt = pendingImageName;
          prev.appendChild(im);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
      e.target.value = "";
    });

    // Dictée vocale
    $("#micBtn").addEventListener("click", () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        alert("Dictée vocale non supportée par ce navigateur.");
        return;
      }
      const rec = new SR();
      rec.lang = "fr-FR";
      rec.interimResults = false;
      rec.onresult = (ev) => {
        const t = ev.results[0][0].transcript;
        $("#promptInput").value = ($("#promptInput").value + " " + t).trim();
        $("#promptInput").focus();
      };
      rec.onerror = () => {};
      rec.start();
    });

    /* ============================= */
    /* Init                          */
    /* ============================= */
    if (!currentId && conversations.length > 0) currentId = conversations[0].id;
    if (!currentId) newConv();
    renderSidebar();
    render();

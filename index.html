<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#e6e2ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="NEXUS AI">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="icon" type="image/png" sizes="512x512" href="icon-512.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><title>NEXUS AI</title>
<style>
:root{--tx:#2b2340;--dm:#8a7fb0;--er:#e0445a;--brand:#7c5cff;--brand2:#c86bff;--bg1:#e6e2ff;--bg2:#f0efff;--bg3:#d9e8ff;--soft:#f8f6ff;--line:rgba(120,90,220,.12);
  --fond:linear-gradient(180deg,#e6e2ff 0%,#f0efff 30%,#e6e2ff 60%,#e2e6ff 100%);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --headh:calc(var(--sat) + 64px);--barh:calc(var(--sab) + 64px);--col:820px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Le fond est peint sur html ET body avec le même dégradé fixe : aucune bande de couleur ne peut apparaître en bas, quel que soit l'appareil. */
html{height:100%;background:#e6e2ff var(--fond) fixed;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;background:transparent;color:var(--tx);font:16px -apple-system,system-ui,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:transparent;padding:0 var(--sar) 0 var(--sal)}
/* ===== EN-TETE ===== */
header{position:fixed;top:calc(var(--sat) + 10px);left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 calc(14px + var(--sar)) 0 calc(14px + var(--sal));min-height:52px;pointer-events:none}header>*{pointer-events:auto}
header>button{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(139,92,255,.18);color:var(--brand);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(60,30,140,.16);touch-action:manipulation}
.head-center{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;cursor:pointer}
.logo{width:34px;height:34px;object-fit:contain;display:block;flex-shrink:0}
.head-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1;min-width:0}
.head-title{font-family:Georgia,'Times New Roman',serif;font-size:clamp(17px,5vw,20px);letter-spacing:2px;color:var(--tx);white-space:nowrap}
.head-sub{font-size:10px;color:var(--dm);margin-top:2px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== VUES ===== */
main{flex:1;min-height:0;position:relative;z-index:1;display:flex;flex-direction:column;overflow:hidden}
.v{display:none;flex:1;min-height:0;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--headh) + 14px) 14px calc(20px + var(--sab));width:100%;max-width:var(--col);margin:0 auto}.v.on{display:flex}
#v-chat{padding:0 14px;overflow:hidden;max-width:none}
/* ===== CHAT : les réponses de Nexus occupent toute la largeur, sans bulle ===== */
#msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:18px;padding:calc(var(--headh) + 6px) 0 calc(var(--barh) + 14px);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent calc(var(--headh) - 8px),#000 calc(var(--headh) + 36px),#000 calc(100% - var(--barh) - 30px),transparent calc(100% - var(--barh) + 6px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,transparent calc(var(--headh) - 8px),#000 calc(var(--headh) + 36px),#000 calc(100% - var(--barh) - 30px),transparent calc(100% - var(--barh) + 6px),transparent 100%)}
.m{width:100%;max-width:var(--col);margin:0 auto;display:flex;flex-direction:column}
.m.user{align-items:flex-end}
.bb{line-height:1.55;font-size:16px;word-wrap:break-word;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.user .bb{max-width:88%;padding:11px 15px;border-radius:20px 20px 6px 20px;background:#eef2ff;color:var(--tx);border:1px solid rgba(120,90,220,.12);box-shadow:0 2px 10px rgba(120,90,220,.08)}
.ai .bb{padding:2px 2px;background:none;border:0;box-shadow:none;color:var(--tx);width:100%}
.ai .bb.card{padding:12px 14px;border-radius:16px;background:#e9e2ff;color:#5b4a8a;border:1px solid rgba(120,90,220,.10)}
pre{background:var(--tx);color:#fff;padding:12px;border-radius:12px;overflow-x:auto;font-size:13px;margin:8px 0;max-width:100%}code{font-family:Menlo,Consolas,monospace;font-size:13px;background:var(--line);padding:1px 5px;border-radius:5px}pre code{background:none;padding:0}
a{color:var(--brand)}
.mt{font-size:11px;color:var(--dm);margin:8px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;row-gap:4px}.mt .who{flex-basis:100%;margin-bottom:2px}.mt button{background:none;border:0;font-size:15px;padding:4px 6px;color:var(--dm);cursor:pointer;touch-action:manipulation}
.mt button[data-a="sv"]{font-size:12px;border:1px solid rgba(120,90,220,.20);border-radius:10px;padding:4px 9px;background:var(--soft);color:#6b5aa8}
.mt .who{display:inline-flex;align-items:center;gap:6px;font-weight:600;letter-spacing:.04em;color:var(--dm)}.mt .av{width:24px;height:24px;object-fit:contain}
.mt button.on{background:rgba(124,92,255,.14);border-radius:10px;color:var(--brand)}.mt button.on.bad{background:rgba(224,68,90,.14);color:var(--er)}
.srcs{font-size:12px;color:var(--dm);margin-top:8px;line-height:1.6;overflow-wrap:anywhere}
.tb{overflow-x:auto;margin:6px 0;max-width:100%}.tb table{border-collapse:collapse;font-size:13px}.tb th,.tb td{border:1px solid rgba(120,90,220,.25);padding:4px 8px;text-align:left}.tb th{background:rgba(120,90,220,.10)}
.bq{display:block;border-left:3px solid #c9bdf5;padding-left:8px;color:#6b5aa8}.bb hr{border:0;border-top:1px solid rgba(120,90,220,.25);margin:8px 0}
.gimg{max-width:100%;max-height:70vh;border-radius:14px;display:block;margin-top:8px;cursor:zoom-in}
.card .cbtn{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.card button,.clist button{border:1px solid rgba(120,90,220,.25);background:#fff;color:#5b4a8a;border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer;touch-action:manipulation}.card .cbtn button:first-child{background:linear-gradient(135deg,#8b5cff,var(--brand2));color:#fff;border:0}
.clist{display:flex;flex-direction:column;gap:6px;margin-top:8px}.clist button{text-align:left}
.ath{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--dm)}.ath .th{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}.ath .fi{width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px}
#stock{margin-top:22px}.stock-title{font-size:16px;font-weight:700;color:var(--tx);margin:0 0 4px}.stock-card{background:#fff;border:1px solid rgba(120,90,220,.10);border-radius:12px;padding:12px;margin-bottom:8px}.stock-actions{display:flex;gap:8px;margin-top:8px}.stock-actions button{background:var(--soft);border:1px solid rgba(120,90,220,.15);border-radius:10px;padding:6px 10px;font-size:12px;color:#6b5aa8;cursor:pointer}
/* ===== AVATAR DE FOND : proportionné à la plus petite dimension de l'écran ===== */
#bgav{position:absolute;left:0;right:0;top:calc(var(--headh) + 10px);z-index:0;pointer-events:none;display:flex;justify-content:center;transition:opacity .7s,top .7s,transform .7s;perspective:900px}
#bgav .avw{position:relative;width:clamp(110px,min(58vw,32vh),240px);aspect-ratio:1;animation:fly 7s ease-in-out infinite;transform-style:preserve-3d}
#bgav img{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 22px rgba(90,60,200,.28))}
#bgav.chat{opacity:.16;top:calc(50% - 120px);transform:scale(1.15)}
#bgav.off{opacity:0}
@keyframes fly{0%,100%{transform:translateY(0) rotate(-2deg)}25%{transform:translateY(-14px) rotate(1.5deg)}50%{transform:translateY(-4px) rotate(2.5deg)}75%{transform:translateY(-16px) rotate(-1deg)}}
.wink{position:absolute;left:55%;top:35.5%;width:9.6%;height:12%;border-radius:50%;background:radial-gradient(ellipse,#3a2878 0%,#2b1d5e 75%);opacity:0;transform:scaleY(.1)}
.wink::after{content:'';position:absolute;left:6%;right:6%;top:46%;height:3px;border-radius:3px;background:#c4e8ff;box-shadow:0 0 7px #8fd0ff}
.avw.doWink .wink{animation:wk .9s ease-in-out}
@keyframes wk{0%,100%{opacity:0;transform:scaleY(.1)}20%,80%{opacity:1;transform:scaleY(1)}}
.avw.doWave img{transform-origin:78% 82%;animation:coucou 2.2s ease-in-out}
@keyframes coucou{0%,100%{transform:rotate(0)}12%{transform:rotate(-13deg) translateY(-6px)}26%{transform:rotate(-6deg) translateY(-10px)}40%{transform:rotate(-14deg) translateY(-6px)}54%{transform:rotate(-6deg) translateY(-10px)}68%{transform:rotate(-13deg) translateY(-6px)}84%{transform:rotate(-2deg)}}
.avw.doSpin img{animation:tour 1.7s cubic-bezier(.5,0,.3,1)}@keyframes tour{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
.avw.doHop img{animation:saut 1.1s ease-out}@keyframes saut{0%,100%{transform:translateY(0) scale(1,1)}18%{transform:translateY(4px) scale(1.06,.94)}45%{transform:translateY(-34px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.05,.95)}85%{transform:translateY(-8px)}}
/* accueil : l'avatar propose, les suggestions sont ses bulles */
.wel{position:relative;text-align:center;color:var(--dm);padding:calc(clamp(110px,min(58vw,32vh),240px) + 40px) 6px 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sugs{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;transition:opacity .35s}.sugs.out{opacity:0}
.sug{display:flex;align-items:center;justify-content:center;gap:8px;width:auto;max-width:92%;padding:13px 20px;border-radius:22px 22px 22px 8px;border:1px solid rgba(120,90,220,.16);background:rgba(255,255,255,.92);color:#5b4a8a;font-size:clamp(14px,4vw,15.5px);text-align:left;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 18px rgba(90,60,200,.12);animation:pop .55s both,bob 4.6s ease-in-out .9s infinite}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.9)}100%{opacity:1;transform:none}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){#bgav .avw,.avw.doWave img,.avw.doSpin img,.avw.doHop img,.sug{animation:none}}
/* petits écrans en hauteur (paysage) : pas d'avatar, plus de place pour le texte */
@media (max-height:480px){#bgav{display:none}.wel{padding-top:20px}}
/* ===== BARRE DU BAS ===== */
#bar{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 8px);z-index:50;display:flex;gap:10px;align-items:flex-end;justify-content:center;padding:0 calc(12px + var(--sar)) 0 calc(12px + var(--sal));pointer-events:none;touch-action:manipulation}#bar>*{pointer-events:auto}
#bar>#nw,#bar>#sb{flex-shrink:0}
#nw,#sb{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,rgba(139,92,255,.16),rgba(200,107,255,.16));border:1px solid rgba(139,92,255,.18);color:var(--brand);box-shadow:0 8px 24px rgba(60,30,140,.18);display:flex;align-items:center;justify-content:center;padding:0;font-size:0;cursor:pointer;touch-action:manipulation;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#sb{background:linear-gradient(135deg,#8b5cff,var(--brand2));color:#fff;border:0;box-shadow:0 8px 22px rgba(139,92,255,.45)}#sb:disabled{opacity:.45;box-shadow:none;cursor:default}
#nw svg,#sb svg{display:block}
#inwrap{flex:1;min-width:0;max-width:calc(var(--col) - 108px);display:flex;flex-direction:column;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(120,90,220,.15);border-radius:24px;box-shadow:0 8px 24px rgba(60,30,140,.18)}
#inrow{display:flex;align-items:center;min-width:0;padding-right:4px}
#fchip{display:none;align-items:center;gap:6px;margin:8px 8px 0 10px;padding:4px 4px 4px 10px;border-radius:14px;background:#efe9ff;color:#5b4a8a;font-size:12px;min-width:0}
#fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fx{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:0;background:rgba(124,92,255,.15);color:var(--brand);font-size:12px;line-height:1;cursor:pointer;padding:0;touch-action:manipulation}
#focr{height:24px;flex-shrink:0;border-radius:12px;border:0;background:rgba(124,92,255,.15);color:var(--brand);font-size:12px;font-weight:700;padding:0 8px;cursor:pointer;display:none}
#fth{display:none;width:34px;height:34px;object-fit:cover;border-radius:8px;flex-shrink:0}
#in{flex:1;min-width:0;background:transparent;border:0;border-radius:22px;color:var(--tx);padding:12px 12px 12px 16px;font:inherit;font-size:16px;resize:none;max-height:120px;outline:0;box-shadow:none;-webkit-user-select:text;user-select:text}
#in::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mic,#att{width:34px;height:34px;flex-shrink:0;border-radius:50%;background:transparent;border:0;color:#a8a0c8;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
#mic svg,#att svg{width:20px;height:20px;display:block}#mic.on{background:rgba(239,68,68,.12);color:#ef4444}
/* ===== HISTORIQUE / REGLAGES ===== */
#q{width:100%;background:#fff;border:1px solid rgba(120,90,220,.15);border-radius:12px;padding:11px;color:var(--tx);font-size:16px;margin:0 0 12px;outline:0}
.sw{display:flex;align-items:center;gap:8px}.sw input{width:22px;height:22px}.h{font-size:12px;color:var(--dm);margin-top:6px;word-break:break-word}
.b2{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--tx);cursor:pointer;font:inherit;touch-action:manipulation}.b2.r{color:#ef4444}.b2:disabled{opacity:.5}
.hi{display:flex;gap:8px;align-items:center;padding:12px;border:1px solid rgba(120,90,220,.10);border-radius:12px;margin-bottom:8px;background:#fff;cursor:pointer}.hi div{flex:1;min-width:0}.hi small{color:var(--dm)}
.ib{width:38px;height:38px;border-radius:50%;background:#f1efff;border:1px solid rgba(120,90,220,.10);font-size:16px;color:var(--dm);cursor:pointer;flex-shrink:0}
textarea#rep{width:100%;height:90px;margin-top:8px;background:var(--soft);color:var(--dm);border:1px solid var(--line);border-radius:10px;font-size:11px}
#ts{position:fixed;bottom:calc(var(--barh) + 16px);left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;display:none;z-index:1100;max-width:90vw;text-align:center}
.set-card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(120,90,220,.08);border:1px solid rgba(120,90,220,.08)}
.set-title{font-size:18px;font-weight:700;color:var(--tx);margin:0 0 4px}.set-sub{font-size:13px;font-weight:700;color:var(--tx);margin:16px 0 8px}
.set-note{font-size:12px;color:var(--dm);line-height:1.4;margin:6px 0}
.set-line{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f0edff;flex-wrap:wrap}.set-line:last-child{border-bottom:0}.set-line b{flex:1;font-size:14px}.set-line .h{width:100%;order:11;margin-top:4px}
.j-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0edff;cursor:pointer}.j-row b{flex:1;font-size:14px}
.guide h2{margin:6px 0 10px}.guide h3{margin:18px 0 6px;color:var(--brand)}.guide h4{margin:10px 0 2px}.guide p{margin:0 0 8px;line-height:1.5;font-size:14px;overflow-wrap:anywhere}.guide a{color:var(--brand)}
.legal-bas{margin:18px 6px 8px;text-align:center;font-size:12px;color:var(--dm);line-height:1.9}.legal-bas a{color:var(--dm);text-decoration:underline}
.pcn{margin-top:8px;font-size:13.5px}
#pbadge{position:absolute;z-index:6;top:calc(var(--headh) + 6px);left:50%;transform:translateX(-50%);align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1px solid rgba(124,92,255,.28);background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--brand);font:inherit;font-size:13px;font-weight:600;box-shadow:0 6px 18px rgba(90,60,200,.16);cursor:pointer}
/* ===== FENÊTRES (accueil, installation) ===== */
#fr{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);background:rgba(30,20,70,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}#fr[hidden]{display:none}
.frb{width:min(100%,440px);max-height:100%;overflow:auto;background:#fff;color:var(--tx);border-radius:24px;padding:22px 20px;box-shadow:0 24px 60px rgba(30,20,70,.35);line-height:1.5}
.frb h2{margin:0 0 10px;font-size:20px}.frb h3{margin:14px 0 4px;font-size:15px;color:var(--brand)}.frb p,.frb li{font-size:14.5px}.frb ul,.frb ol{padding-left:20px}.frb li{margin-bottom:8px}.frb .note{font-size:12.5px;color:var(--dm)}
.frb .pri,.b2.pri{background:linear-gradient(135deg,#8b5cff,#c86bff);color:#fff;border:0;font-weight:600}
#lb{position:fixed;inset:0;z-index:999;background:rgba(10,8,25,.94);display:flex;align-items:center;justify-content:center;padding:var(--sat) 8px var(--sab)}#lb[hidden]{display:none}#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#lb button{position:absolute;top:calc(var(--sat) + 14px);right:16px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:18px}
#dlmenu{position:fixed;inset:0;z-index:100;background:rgba(43,35,64,.45);align-items:center;justify-content:center}#dlbox{background:#fff;border-radius:18px;padding:16px;width:min(86vw,340px);max-height:80vh;overflow-y:auto}
/* Puter ne montre jamais ses propres fenêtres d'erreur dans Nexus (la connexion voulue par l'utilisateur est ouverte à part). */
puter-dialog,iframe[src*="puter.com"]{display:none!important}
/* ===== ÉCRANS LARGES ET PETITS ===== */
@media (min-width:900px){.v{padding-left:24px;padding-right:24px}}
@media (max-width:340px){.bb{font-size:15px}#nw,#sb{width:40px;height:40px}.head-sub{display:none}}
</style></head><body>
<div id="app">
<header>
  <button data-v="hist" title="Historique"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#7c5cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
  <div class="head-center on" data-v="chat" title="Retour au chat">
    <img src="logo.png" class="logo" alt="NEXUS">

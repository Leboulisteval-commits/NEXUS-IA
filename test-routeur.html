<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Routeur NLI - nli-deberta-v3-small (~111 Mo) - NEXUS</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 14px;
      line-height: 1.45;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    h1 { font-size: 1.15rem; margin: 0 0 6px; color: var(--accent); }
    p.sub { font-size: 0.85rem; color: var(--muted); margin: 0 0 12px; }
    button {
      background: var(--accent-hover);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:active { transform: scale(0.99); }
    button:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
    .bar-bg {
      height: 8px;
      background: #1f2937;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }
    .status { font-size: 0.88rem; color: #d1d5db; margin-top: 8px; min-height: 1.2em; }
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .presets button {
      width: auto;
      background: #1f2937;
      border: 1px solid #374151;
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: 8px;
      font-weight: 500;
    }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
    input, textarea {
      width: 100%;
      background: #0b1120;
      color: var(--text);
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    textarea { resize: vertical; }
    .verdict {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.35);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .verdict-title { font-weight: 700; color: var(--ok); font-size: 1rem; }
    .verdict-meta { font-size: 0.82rem; color: #d1d5db; margin-top: 4px; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #1f2937;
      font-size: 0.88rem;
    }
    .row:last-child { border-bottom: none; }
    .row.top { color: var(--ok); font-weight: 600; }
    .warn { color: var(--warn); }
    .err { color: var(--err); white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>NEXUS — Test Routeur NLI (~111 Mo)</h1>
      <p class="sub">
        Modèle : <code>Xenova/nli-deberta-v3-small</code> (quantifié ~111 Mo) en <code>zero-shot-classification</code>.
      </p>
      <button id="btnLoad" type="button">1. Télécharger et charger le routeur (~111 Mo)</button>
      <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
      <div class="status" id="status">Prêt à charger (ferme les onglets de test précédents avant).</div>
    </div>

    <div class="card">
      <div class="presets">
        <button type="button" data-prev="" data-msg="Raconte moi une histoire sur un dev qui casse tout">Piège : histoire sur un dev</button>
        <button type="button" data-prev="" data-msg="Nan mais je veux pas de code explique juste comment ça marche">Piège : pas de code</button>
        <button type="button" data-prev="Fais-moi un script python pour trier mes photos" data-msg="Euh non en fait laisse tomber le script fais juste un résumé">Suite : changement d'avis</button>
        <button type="button" data-prev="Traduis ce texte en espagnol" data-msg="Fais pareil en anglais stp">Suite : contexte</button>
        <button type="button" data-prev="" data-msg="Aide-moi à faire marcher ce truc sur mon site">Oral : aide site/code</button>
      </div>

      <label for="prevMsg">Message précédent (optionnel)</label>
      <input id="prevMsg" type="text" placeholder="Ex : Fais-moi un script python..." />

      <label for="userMsg">Message actuel (à taper ou dicter)</label>
      <textarea id="userMsg" rows="3" placeholder="Ex : Raconte moi une histoire sur un dev qui casse tout"></textarea>

      <button id="btnRun" type="button" disabled>2. Tester le routage NLI</button>
      <div id="result" style="margin-top: 12px;"></div>
    </div>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    env.allowLocalModels = false;

    const MODEL_ID = 'Xenova/nli-deberta-v3-small';

    const INTENT_LABELS = {
      "writing a fictional story, tale, poem or creative narrative": "creative",
      "writing, debugging or explaining computer code, programming or a website script": "code",
      "translating text or words from one language to another": "translation",
      "summarizing or condensing a long text or document": "long_context",
      "solving a math calculation or equation": "math",
      "general chat, simple question or everyday explanation": "general"
    };

    const btnLoad = document.getElementById('btnLoad');
    const btnRun = document.getElementById('btnRun');
    const barFill = document.getElementById('barFill');
    const statusEl = document.getElementById('status');
    const prevInput = document.getElementById('prevMsg');
    const userInput = document.getElementById('userMsg');
    const resultEl = document.getElementById('result');

    let classifier = null;

    function buildInputText(currentText, previousText) {
      const curr = currentText.trim();
      const prev = (previousText || "").trim();
      const isShortFollowUp = prev.length > 0 && curr.split(/\s+/).length <= 8;
      if (isShortFollowUp) {
        return `Previous message: ${prev}. Current message: ${curr}`;
      }
      return curr;
    }

    document.querySelectorAll('.presets button').forEach((btn) => {
      btn.addEventListener('click', () => {
        prevInput.value = btn.dataset.prev || '';
        userInput.value = btn.dataset.msg || '';
        resultEl.innerHTML = '';
      });
    });

    btnLoad.addEventListener('click', async () => {
      btnLoad.disabled = true;
      resultEl.innerHTML = '';
      const t0 = performance.now();

      try {
        statusEl.textContent = "Téléchargement du modèle NLI (~111 Mo) en cours...";
        classifier = await pipeline('zero-shot-classification', MODEL_ID, {
          quantized: true,
          progress_callback: (info) => {
            if (info.status === 'progress' && typeof info.progress === 'number') {
              const pct = Math.min(100, Math.round(info.progress));
              barFill.style.width = pct + '%';
              statusEl.textContent = `Téléchargement (${info.file || 'modèle'}) : ${pct}%`;
            } else if (info.status === 'done') {
              statusEl.textContent = `Prêt : ${info.file || 'fichier'}`;
            }
          }
        });

        const sec = ((performance.now() - t0) / 1000).toFixed(1);
        barFill.style.width = '100%';
        statusEl.textContent = `✅ Routeur NLI chargé en ${sec} s !`;
        btnRun.disabled = false;
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = `<span class="err">❌ Erreur de chargement :
${err.message}</span>`;
        btnLoad.disabled = false;
      }
    });

    btnRun.addEventListener('click', async () => {
      const rawText = userInput.value.trim();
      const rawPrev = prevInput.value.trim();
      if (!rawText || !classifier) return;

      btnRun.disabled = true;
      resultEl.innerHTML = '<div class="status">Analyse logique en cours...</div>';
      const t0 = performance.now();

      try {
        const textToClassify = buildInputText(rawText, rawPrev);
        const candidateLabels = Object.keys(INTENT_LABELS);

        const res = await classifier(textToClassify, candidateLabels, {
          hypothesis_template: "The user's request is about {}."
        });

        const scored = res.labels.map((label, idx) => ({
          intent: INTENT_LABELS[label],
          label,
          score: res.scores[idx]
        }));

        const best = scored[0];
        const second = scored[1] || { score: 0 };
        const margin = best.score - second.score;
        const ms = Math.round(performance.now() - t0);

        let html = `
          <div class="verdict">
            <div class="verdict-title">🎯 Intention retenue : ${best.intent}</div>
            <div class="verdict-meta">
              Temps : <strong>${ms} ms</strong> · Écart avec le 2e : <strong>${(margin * 100).toFixed(1)} pts</strong>
            </div>
          </div>
        `;

        scored.forEach((row, idx) => {
          const pct = (row.score * 100).toFixed(1);
          const isTop = idx === 0;
          html += `
            <div class="row ${isTop ? 'top' : ''}">
              <span>${idx + 1}. ${row.intent}</span>
              <span>${pct} %</span>
            </div>
          `;
        });

        resultEl.innerHTML = html;
      } catch (err) {
        console.error(err);
        resultEl.innerHTML = `<div class="err">❌ Erreur pendant l'analyse :
${err.message}</span>`;
      } finally {
        btnRun.disabled = false;
      }
    });
  </script>
</body>
</html>

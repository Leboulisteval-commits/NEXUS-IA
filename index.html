<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS AI — Vérification croisée par IA</title>
<meta name="description" content="NEXUS AI : un producteur IA rédige, un vérificateur indépendant contrôle.">
<link rel="canonical" href="https://leboulisteval-commits.github.io/NEXUS-IA/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧠%3C/text%3E%3C/svg%3E">
<script src="https://js.puter.com/v2/" defer></script>
<style>
:root{--bg:#f6f6f3;--cd:#fff;--tx:#1c1c1a;--mu:#6b6b64;--ac:#4a49d6;--bt:#fff;--ok:#17734a;--ko:#b3261e;--wa:#a35f00;--bd:#dedcd4;--wn:#fff3cd;--wt:#664d03;--wb:#ffecb5;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--cd:#1e1e1c;--tx:#ecece7;--mu:#a2a29a;--ac:#9a99ff;--bt:#141413;--ok:#4cc38a;--ko:#ff8a80;--wa:#f0b04a;--bd:#34342f;--wn:#3a2f14;--wt:#ffd98a;--wb:#5a4a20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--cd:#1e1e1c;--tx:#ecece7;--mu:#a2a29a;--ac:#9a99ff;--bt:#141413;--ok:#4cc38a;--ko:#ff8a80;--wa:#f0b04a;--bd:#34342f;--wn:#3a2f14;--wt:#ffd98a;--wb:#5a4a20;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:1rem}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{background:var(--bg);text-align:center;padding:10px;border-bottom:1px solid var(--bd);flex-shrink:0;z-index:10}
header h1{font-size:18px;margin:0}
header .mu{font-size:12px}
main{flex:1;overflow-y:auto;padding:14px;scroll-behavior:smooth;display:flex;flex-direction:column;gap:12px}
.msg-user{align-self:flex-end;background:var(--ac);color:var(--bt);padding:10px 14px;border-radius:14px 14px 0 14px;max-width:85%;white-space:pre-wrap}
.msg-ai{align-self:flex-start;background:var(--cd);border:1px solid var(--bd);padding:12px;border-radius:14px 14px 14px 0;max-width:90%;width:100%}
.msg-ai pre{white-space:pre-wrap;margin:0;font:inherit}
.verif-box{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);font-size:13px}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-weight:bold;font-size:11px;margin-bottom:4px}
.badge.ok{background:#e6f4ea;color:#17734a}.badge.wa{background:#fef7e0;color:#a35f00}.badge.ko{background:#fce8e6;color:#b3261e}
@media(prefers-color-scheme:dark){.badge.ok{background:#1e3a2f;color:#4cc38a}.badge.wa{background:#3a2f14;color:#f0b04a}.badge.ko{background:#3a1a1a;color:#ff8a80}}
.input-area{background:var(--bg);border-top:1px solid var(--bd);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:10px 14px;min-height:44px;max-height:120px;resize:none;margin:0;overflow-y:auto}
button{font:inherit;background:var(--ac);color:var(--bt);border:0;border-radius:20px;padding:10px 16px;cursor:pointer;height:44px;font-weight:bold}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.s{background:var(--bd);color:var(--tx);border-radius:10px;height:auto;padding:8px 12px;font-weight:normal;font-size:14px}
details.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:0}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--mu)}
label{display:block;margin:8px 0 2px;font-size:13px;color:var(--mu)}
label.chk{display:flex;align-items:center;gap:8px;color:var(--tx);font-size:14px;margin:4px 0}
label.chk input{width:auto;margin:0}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:6px}
.bn{border-left:3px solid var(--wa);background:var(--bg);padding:8px;border-radius:4px;margin:6px 0;font-size:13px}
.bn.ko{border-color:var(--ko)}
h3{margin:12px 0 6px;font-size:14px;color:var(--mu)}
</style>
</head>
<body>

<header>
  <h1>NEXUS AI</h1>
  <div class="mu">Vérification croisée</div>
</header>

<main id="chat">
  <!-- Les messages s'afficheront ici -->
</main>

<div class="input-area">
  <details class="c">
    <summary>⚙️ Configuration (Mode & Réglages)</summary>
    <div style="margin-top:8px">
      <label for="mo">Mode de fonctionnement</label>
      <select id="mo" onchange="toggleSettings()">
        <option value="puter">Puter AI (Sans clé)</option>
        <option value="cles">Clés API</option>
        <option value="manuel">Manuel</option>
      </select>
      <label class="chk"><input type="checkbox" id="vf" checked> Faire vérifier par une autre IA</label>
    </div>
    
    <div id="api-settings" style="display:none; border-top:1px solid var(--bd); margin-top:10px;">
      <datalist id="dl">
        <option value="https://api.groq.com/openai/v1/chat/completions"></option>
        <option value="https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"></option>
        <option value="https://api.mistral.ai/v1/chat/completions"></option>
      </datalist>
      <h3>Producteur</h3>
      <input id="up" list="dl" placeholder="Adresse API">
      <input id="kp" type="password" placeholder="Clé API">
      <input id="mp2" placeholder="Modèle (ex: llama-3.1-8b-instant)">
      <button type="button" class="s" onclick="setPV();testP('p')">Tester Producteur</button>
      <div class="mu" id="tp"></div>

      <h3>Vérificateur</h3>
      <input id="uv" list="dl" placeholder="Adresse API">
      <input id="kv" type="password" placeholder="Clé API">
      <input id="mv" placeholder="Modèle">
      <button type="button" class="s" onclick="setPV();testP('v')">Tester Vérificateur</button>
      <div class="mu" id="tv"></div>
    </div>
  </details>

  <div class="input-row">
    <textarea id="q" placeholder="Posez votre question..." rows="1"></textarea>
    <button type="button" onclick="start()">Envoyer</button>
  </div>
</div>

<script>
const K="nexus_chat_v1", KP="nexus_prov";
let T=[], busy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toggleSettings() {
  $("#api-settings").style.display = ($("#mo").value === "cles") ? "block" : "none";
}

// --- SAUVEGARDE ET CHARGEMENT ---
function save(){
  try{
    // On garde les 50 derniers messages pour la mémoire
    localStorage.setItem(K, JSON.stringify(T.slice(-50), (k,v)=>k[0]==="_"?undefined:v));
  }catch(e){}
}
function load(){
  try{T=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){T=[]}
  T.forEach(t=>{
    if(["en_cours","attente","manuel"].includes(t.status)) t.status="interrompue";
  });
}

// --- PROMPTS ---
const VP="Tu es un vérificateur indépendant. Tu reçois l'HISTORIQUE d'une conversation, une DEMANDE et un RÉSULTAT. Question unique : le résultat correspond-il à la demande ? 1) Déduis 2 à 5 critères. 2) Juge : OUI, NON ou NON_TRANCHABLE avec preuve. 3) Pour un prix/date non prouvable : NON_TRANCHABLE. Réponds UNIQUEMENT par ce JSON : {\"criteres\":[{\"critere\":\"\",\"verdict\":\"OUI|NON|NON_TRANCHABLE\",\"preuve\":\"\"}],\"ecarts\":[\"\"]}. Aucune phrase hors JSON.";

function route(d){
  const t=d.toLowerCase();
  if(/(image|photo|dessin|logo|vidéo|video|voix|audio|musique|acheter|achat|commande|panier|stock)/.test(t))return{type:"non_supporte"};
  if(/(code|fonction|script|programme|bug|python|javascript|html)/.test(t))return{type:"code",tier:"complex"};
  if(/(cherche|source|compare|prix|actualité|qui est|quand|combien)/.test(t))return{type:"question",tier:"default"};
  if(/(écris|rédige|mail|résume|traduis|reformule|texte)/.test(t))return{type:"rédaction",tier:"default"};
  return{type:"autre",tier:"quick"};
}

function pj(s){try{const m=String(s).match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):null}catch(e){return null}}

// --- API & PUTER ---
function PV(k){try{return JSON.parse(localStorage.getItem(KP)||"{}")[k]||{}}catch(e){return{}}}
function setPV(){const o={};["p","v"].forEach(k=>{o[k]={url:$("#u"+k).value.trim(),key:$("#k"+k).value.trim(),modele:$(k==="p"?"#mp2":"#mv").value.trim()}});try{localStorage.setItem(KP,JSON.stringify(o))}catch(e){}}
function fillS(){["p","v"].forEach(k=>{const p=PV(k);$("#u"+k).value=p.url||"";$("#k"+k).value=p.key||"";$(k==="p"?"#mp2":"#mv").value=p.modele||""})}

async function callP(k,prompt){
  const p=PV(k);
  if(!p.url||!p.key||!p.modele)throw new Error("Réglages API incomplets.");
  let r;
  try{r=await fetch(p.url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+p.key},body:JSON.stringify({model:p.modele,messages:[{role:"user",content:prompt}]})})}
  catch(e){throw new Error("Appel bloqué ou réseau.")}
  if(r.status===429){const e=new Error("Quota épuisé");e.code="rate_limited";throw e}
  if(!r.ok)throw new Error("Erreur API "+r.status);
  const j=await r.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
}
async function testP(k){const e=$("#t"+k);e.textContent="Test…";try{await callP(k,"Réponds ok");e.textContent="✅ Succès"}catch(x){e.textContent="❌ "+x.message}}

async function callPuter(prompt) {
  if (!window.puter || !puter.ai) throw new Error("Puter non chargé.");
  const r = await puter.ai.chat(prompt);
  return String(r);
}

// --- LOGIQUE DE CONVERSATION ---
function manual(t,role,prompt){return new Promise(res=>{t.status="manuel";t._m={role,prompt,res};save();render()})}

async function ask(t,role,prompt,tier,json){
  let txt;
  if(t.mode==="puter") txt=await callPuter(prompt);
  else if(t.mode==="manuel") txt=await manual(t,role,prompt);
  else txt=await callP(role.startsWith("Vérif")?"v":"p",prompt);

  if(!json) return txt;
  const o=pj(txt);if(o)return o;
  const o2=pj(await (t.mode==="puter"?callPuter(prompt+"\nRappel: JSON uniquement."):callP(role.startsWith("Vérif")?"v":"p",prompt+"\nRappel: JSON uniquement.")));
  return o2;
}

async function verifier(t){
  const o=await ask(t,"Vérificateur",VP+"\n\nHISTORIQUE:\n"+t.hist+"\n\nDEMANDE:\n"+t.demande+"\n\nRÉSULTAT:\n"+t.result,t.tier,true);
  if(!o||!Array.isArray(o.criteres)||!o.criteres.length)return{verdict:"NON_TRANCHABLE",criteres:[],ecarts:["Réponse vérificateur illisible."]};
  const c=o.criteres.map(x=>({critere:String(x.critere||""),verdict:String(x.verdict||"").toUpperCase(),preuve:String(x.preuve||"")}));
  const v=c.some(x=>x.verdict==="NON")?"NON":c.some(x=>x.verdict!=="OUI")?"NON_TRANCHABLE":"OUI";
  const ec=(Array.isArray(o.ecarts)?o.ecarts:[]).concat(c.filter(x=>x.verdict==="NON").map(x=>x.critere));
  return{verdict:v,criteres:c,ecarts:[...new Set(ec.filter(Boolean))]}
}

async function run(t){
  t.status="en_cours";t.err="";save();render();
  try{
    if(!t.result){
      t.step="Production";
      // Construction du prompt avec mémoire (historique)
      let promptP = t.hist ? `Voici l'historique de notre conversation :\n${t.hist}\n\nNouvelle demande :\n${t.demande}` : t.demande;
      t.result = await ask(t,"Producteur",promptP,t.tier,false);
      save();render();
    }
    if(t.verif){
      while(t.round<3){
        t.step="Vérification ("+(t.round+1)+")";save();render();
        const v=await verifier(t);t.round++;t.v=v;
        if(v.verdict!=="NON"||t.round>=3)break;
        t.step="Correction";save();render();
        t.result=await ask(t,"Correcteur","Corrige ces écarts :\n"+v.ecarts.join("\n- ")+"\n\nRéponse précédente :\n"+t.result,t.tier,false);
        save();render();
      }
    }
    t.status="fini";
  }
  catch(e){t.status="erreur";t.err=e.message||"Erreur"}
  save();render();
}

// --- INTERFACE ---
function start(){
  const d=$("#q").value.trim();if(!d || busy)return;
  const r=route(d);
  
  // Récupération de l'historique pour la mémoire (les 5 derniers échanges réussis)
  const hist = T.filter(x=>x.id && x.result).slice(-5).map(x=>`Utilisateur: ${x.demande}\nIA: ${x.result}`).join('\n---\n');

  const t={id:Date.now(),demande:d,mode:$("#mo").value,verif:$("#vf").checked,type:r.type,tier:r.tier,status:"en_cours",round:0,hist:hist};
  T.push(t);
  $("#q").value=""; $("#q").style.height="44px";
  
  if(r.type==="non_supporte"){t.status="non_supporte";save();render();return}
  
  busy=true;
  run(t).finally(()=>{busy=false;});
}

function niveau(t){
  if(!t.verif||!t.v)return["Non vérifié","ko"];
  if(t.v.verdict==="OUI")return["Vérifié","ok"];
  if(t.v.verdict==="NON_TRANCHABLE")return["Partiellement vérifié","wa"];
  return["Écarts détectés","ko"];
}

function resume(id){
  const t=T.find(x=>x.id===id);if(t){busy=true;run(t).finally(()=>busy=false);}
}

function skip(id){
  const t=T.find(x=>x.id===id);if(t&&t._skip)t._skip();
}

function okM(id){
  const t=T.find(x=>x.id===id);const v=prompt("Collez la réponse de l'IA :");
  if(!v||!t._m)return;const m=t._m;t._m=null;t.status="en_cours";m.res(v);
}

function copyP(id){
  const t=T.find(x=>x.id===id);
  if(t&&t._m) navigator.clipboard.writeText(t._m.prompt);
}

function render(){
  const chat = $("#chat");
  // On garde le scroll en bas si on y était déjà
  const isScrolledToBottom = chat.scrollHeight - chat.clientHeight <= chat.scrollTop + 50;

  let h="";
  T.forEach(t=>{
    // Bulle Utilisateur
    h+='<div class="msg-user">'+esc(t.demande)+'</div>';
    
    // Bulle IA
    if(t.status==="non_supporte"){
      h+='<div class="msg-ai"><div class="bn ko">Désolé, les images, vidéos et achats ne sont pas supportés.</div></div>';
    } else if(t.status==="manuel" && t._m){
      h+='<div class="msg-ai"><b>'+esc(t._m.role)+'</b><br><span class="mu" style="font-size:12px">Copiez ce texte dans l\'IA, puis collez sa réponse.</span>';
      h+='<textarea readonly style="width:100%;height:80px;margin:8px 0;font-size:12px">'+esc(t._m.prompt)+'</textarea>';
      h+='<button class="s" onclick="copyP('+t.id+')">Copier</button> ';
      h+='<button class="s" onclick="okM('+t.id+')">Coller la réponse</button></div>';
    } else if(t.status==="erreur"){
      h+='<div class="msg-ai"><div class="bn ko">'+esc(t.err)+'</div><button class="s" onclick="resume('+t.id+')">Réessayer</button></div>';
    } else if(t.status==="interrompue"){
      h+='<div class="msg-ai"><div class="bn">Tâche interrompue.</div><button class="s" onclick="resume('+t.id+')">Reprendre</button></div>';
    } else if(t.status==="attente"){
      h+='<div class="msg-ai"><div class="bn">Quota épuisé. Reprise dans <b id="cd-'+t.id+'"></b>.</div><button class="s" onclick="skip('+t.id+')">Forcer</button></div>';
    } else if(t.status==="en_cours" || t.result) {
      // Affichage de la réponse (même si en cours, on montre la partie déjà générée)
      h+='<div class="msg-ai"><pre>'+esc(t.result || "Réflexion en cours...")+'</pre>';
      
      // Bloc de vérification (caché si pas fini ou pas demandé)
      if(t.verif && t.v){
        const n = niveau(t);
        h+='<div class="verif-box">';
        h+='<span class="badge '+n[1]+'">'+n[0]+'</span>';
        if(t.v.ecarts && t.v.ecarts.length) h+='<div class="mu" style="font-size:12px;color:var(--ko)">⚠️ '+t.v.ecarts.map(esc).join(" ; ")+'</div>';
        
        // Détail des preuves (rétractable)
        if(t.log && t.log.length){
          h+='<details style="margin-top:4px"><summary style="font-size:12px">Voir le détail</summary>';
          h+=t.log.map(l=>'<div style="margin-top:4px">'+(l.criteres||[]).map(c=>'<span class="mu">'+esc(c.verdict)+' : </span>'+esc(c.critere)+'</div>').join("")+'</details>';
        }
        h+='</div>';
      }
      h+='</div>';
    }
  });
  
  chat.innerHTML = h;
  
  if(isScrolledToBottom) chat.scrollTop = chat.scrollHeight;
}

// Auto-resize du textarea
$("#q").addEventListener("input", function() {
  this.style.height = '44px';
  this.style.height = (this.scrollHeight) + 'px';
});
$("#q").addEventListener("keydown", function(e) {
  if(e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    start();
  }
});

// Init
load(); render(); fillS(); toggleSettings();
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS AI — Vérification croisée</title>
<meta name="description" content="NEXUS AI : un producteur IA rédige, un vérificateur indépendant contrôle.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='3'%3E%3C/circle%3E%3Ccircle cx='19' cy='5' r='2'%3E%3C/circle%3E%3Ccircle cx='5' cy='19' r='2'%3E%3C/circle%3E%3Cpath d='M14.5 10.5L17.5 7M9.5 13.5L6.5 17M9.5 10.5L6.5 7M14.5 13.5L17.5 17'%3E%3C/path%3E%3C/svg%3E">
<script src="https://js.puter.com/v2/" defer></script>
<style>
:root {
  --bg: #09090b; --surface: rgba(24, 24, 27, 0.6); --surface-hover: rgba(39, 39, 42, 0.8);
  --border: rgba(255, 255, 255, 0.1); --text: #f4f4f5; --text-muted: #a1a1aa;
  --primary: #6366f1; --primary-hover: #4f46e5; --user-bg: #27272a;
  --ok: #10b981; --wa: #f59e0b; --ko: #ef4444; --glass: rgba(255, 255, 255, 0.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  height: 100vh; height: 100dvh; display: flex; flex-direction: column;
  overflow: hidden; position: relative;
}
.bg-blobs { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: float 20s infinite alternate; }
.blob-1 { background: #6366f1; width: 300px; height: 300px; top: -50px; left: -50px; }
.blob-2 { background: #8b5cf6; width: 250px; height: 250px; bottom: 10%; right: -50px; animation-delay: -5s; }
.blob-3 { background: #0ea5e9; width: 200px; height: 200px; top: 40%; left: 30%; animation-delay: -10s; }
@keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30px, 50px) scale(1.1); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 10; }
.logo-group { display: flex; align-items: center; gap: 10px; }
.logo-group svg { width: 28px; height: 28px; color: var(--primary); }
header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
header h1 span { color: var(--primary); }
.icon-btn { background: var(--glass); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: all 0.2s; }
.icon-btn:hover { background: var(--surface-hover); transform: rotate(90deg); }

main { flex: 1; overflow-y: auto; padding: 20px 20px 100px 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
main::-webkit-scrollbar { width: 6px; }
main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

.msg { display: flex; gap: 12px; max-width: 90%; animation: fadeIn 0.3s ease; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.ai { align-self: flex-start; }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-weight: bold; font-size: 14px; }
.msg.user .avatar { background: var(--primary); color: white; }
.msg.ai .avatar { background: var(--user-bg); border: 1px solid var(--border); }
.msg.ai .avatar svg { width: 16px; height: 16px; color: var(--primary); }
.bubble { padding: 12px 16px; border-radius: 16px; font-size: 15px; white-space: pre-wrap; line-height: 1.6; word-break: break-word; }
.msg.user .bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
.msg.ai .bubble { background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(10px); border-bottom-left-radius: 4px; width: 100%; }

.verif { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: 13px; color: var(--text-muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; margin-bottom: 6px; }
.badge.ok { background: rgba(16, 185, 129, 0.15); color: var(--ok); }
.badge.wa { background: rgba(245, 158, 11, 0.15); color: var(--wa); }
.badge.ko { background: rgba(239, 68, 68, 0.15); color: var(--ko); }
.verif-details { margin-top: 8px; font-size: 12px; }
.verif-details summary { cursor: pointer; color: var(--primary); outline: none; }
.verif-details p { margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--border); }

.input-wrapper { position: fixed; bottom: 0; left: 0; width: 100%; padding: 15px 20px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 60%, transparent); z-index: 10; }
.input-box { display: flex; gap: 8px; background: var(--user-bg); border: 1px solid var(--border); border-radius: 24px; padding: 6px 6px 6px 16px; align-items: flex-end; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: border-color 0.2s; }
.input-box:focus-within { border-color: var(--primary); }
textarea { flex: 1; background: transparent; border: none; color: var(--text); font: inherit; resize: none; min-height: 24px; max-height: 120px; padding: 8px 0; outline: none; }
button.send { background: var(--primary); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; transition: background 0.2s, transform 0.1s; }
button.send:hover { background: var(--primary-hover); }
button.send:active { transform: scale(0.95); }

dialog { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 16px; padding: 20px; max-width: 400px; width: 90%; backdrop-filter: blur(20px); margin: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
dialog::backdrop { background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
dialog h2 { font-size: 18px; margin-bottom: 15px; }
dialog label { display: block; font-size: 13px; color: var(--text-muted); margin: 10px 0 4px; }
dialog input, dialog select { width: 100%; background: var(--user-bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; font: inherit; margin-bottom: 8px; }
dialog button.btn { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
dialog button.btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 8px; }
</style>
</head>
<body>

<div class="bg-blobs">
  <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
</div>

<header>
  <div class="logo-group">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle><circle cx="19" cy="5" r="2"></circle><circle cx="5" cy="19" r="2"></circle><path d="M14.5 10.5L17.5 7M9.5 13.5L6.5 17M9.5 10.5L6.5 7M14.5 13.5L17.5 17"></path>
    </svg>
    <h1>NEXUS <span>AI</span></h1>
  </div>
  <button class="icon-btn" onclick="document.getElementById('settingsModal').showModal()" title="Configuration">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </button>
</header>

<main id="chat"></main>

<div class="input-wrapper">
  <div class="input-box">
    <textarea id="q" placeholder="Posez votre question..." rows="1"></textarea>
    <button class="send" onclick="start()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </div>
</div>

<dialog id="settingsModal">
  <h2>⚙️ Configuration</h2>
  <label for="mo">Mode de fonctionnement</label>
  <select id="mo" onchange="toggleSettings()">
    <option value="puter">Puter AI (Sans clé)</option>
    <option value="cles">Clés API (Fournisseurs)</option>
    <option value="manuel">Manuel</option>
  </select>
  <label style="display:flex;align-items:center;gap:8px;margin-top:15px;">
    <input type="checkbox" id="vf" checked style="width:auto;margin:0;"> Activer la vérification croisée
  </label>
  <div id="api-settings" style="display:none; border-top:1px solid var(--border); margin-top:15px; padding-top:10px;">
    <datalist id="dl">
      <option value="https://api.groq.com/openai/v1/chat/completions"></option>
      <option value="https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"></option>
      <option value="https://api.mistral.ai/v1/chat/completions"></option>
    </datalist>
    <label>Producteur</label>
    <input id="up" list="dl" placeholder="Adresse API">
    <input id="kp" type="password" placeholder="Clé API">
    <input id="mp2" placeholder="Modèle (ex: llama-3.1-8b-instant)">
    <button class="btn btn-secondary" onclick="setPV();testP('p')">Tester Producteur</button>
    <div style="font-size:12px;color:var(--text-muted);margin-top:4px" id="tp"></div>
    <label style="margin-top:15px">Vérificateur</label>
    <input id="uv" list="dl" placeholder="Adresse API">
    <input id="kv" type="password" placeholder="Clé API">
    <input id="mv" placeholder="Modèle">
    <button class="btn btn-secondary" onclick="setPV();testP('v')">Tester Vérificateur</button>
    <div style="font-size:12px;color:var(--text-muted);margin-top:4px" id="tv"></div>
  </div>
  <button class="btn" onclick="document.getElementById('settingsModal').close()">Fermer</button>
</dialog>

<script>
const K="nexus_chat_v1", KP="nexus_prov";
let T=[], busy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toggleSettings() { $("#api-settings").style.display = ($("#mo").value === "cles") ? "block" : "none"; }
function save(){ try{ localStorage.setItem(K, JSON.stringify(T.slice(-50), (k,v)=>k[0]==="_"?undefined:v)); }catch(e){} }
function load(){ try{T=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){T=[]} T.forEach(t=>{ if(["en_cours","attente","manuel"].includes(t.status)) t.status="interrompue"; }); }

const VP="Tu es un vérificateur indépendant. Tu reçois une DEMANDE et un RÉSULTAT. Déduis 2 à 5 critères. Juge : OUI, NON ou NON_TRANCHABLE avec preuve. Pour un prix/date non prouvable : NON_TRANCHABLE. Réponds UNIQUEMENT par ce JSON : {\"criteres\":[{\"critere\":\"\",\"verdict\":\"OUI|NON|NON_TRANCHABLE\",\"preuve\":\"\"}],\"ecarts\":[\"\"]}.";

function route(d){
  const t=d.toLowerCase();
  if(/(image|photo|dessin|logo|vidéo|video|voix|audio|musique|acheter|achat|commande|panier|stock)/.test(t))return{type:"non_supporte"};
  if(/(code|fonction|script|programme|bug|python|javascript|html)/.test(t))return{type:"code",tier:"complex"};
  if(/(cherche|source|compare|prix|actualité|qui est|quand|combien)/.test(t))return{type:"question",tier:"default"};
  if(/(écris|rédige|mail|résume|traduis|reformule|texte)/.test(t))return{type:"rédaction",tier:"default"};
  return{type:"autre",tier:"quick"};
}

function pj(s){try{const m=String(s).match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):null}catch(e){return null}}
function PV(k){try{return JSON.parse(localStorage.getItem(KP)||"{}")[k]||{}}catch(e){return{}}}
function setPV(){const o={};["p","v"].forEach(k=>{o[k]={url:$("#u"+k).value.trim(),key:$("#k"+k).value.trim(),modele:$(k==="p"?"#mp2":"#mv").value.trim()}});try{localStorage.setItem(KP,JSON.stringify(o))}catch(e){}}
function fillS(){["p","v"].forEach(k=>{const p=PV(k);$("#u"+k).value=p.url||"";$("#k"+k).value=p.key||"";$(k==="p"?"#mp2":"#mv").value=p.modele||""})}

async function callP(k,prompt){
  const p=PV(k);
  if(!p.url||!p.key||!p.modele)throw new Error("Réglages API incomplets.");
  let r;
  try{r=await fetch(p.url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+p.key},body:JSON.stringify({model:p.modele,messages:[{role:"user",content:prompt}]})})}
  catch(e){throw new Error("Appel bloqué ou réseau.")}
  if(r.status===429){const e=new Error("Quota épuisé");e.code="rate_limited";throw e}
  if(!r.ok)throw new Error("Erreur API "+r.status);
  const j=await r.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
}
async function testP(k){const e=$("#t"+k);e.textContent="Test…";try{await callP(k,"Réponds ok");e.textContent="✅ Succès"}catch(x){e.textContent="❌ "+x.message}}

async function callPuter(prompt) {
  if (!window.puter || !puter.ai) throw new Error("Puter non chargé.");
  const r = await puter.ai.chat(prompt);
  return String(r);
}

function manual(t,role,prompt){return new Promise(res=>{t.status="manuel";t._m={role,prompt,res};save();render()})}

async function ask(t,role,prompt,tier,json){
  let txt;
  if(t.mode==="puter") txt=await callPuter(prompt);
  else if(t.mode==="manuel") txt=await manual(t,role,prompt);
  else txt=await callP(role.startsWith("Vérif")?"v":"p",prompt);

  if(!json) return txt;
  const o=pj(txt);if(o)return o;
  return null;
}

async function verifier(t){
  const o=await ask(t,"Vérificateur",VP+"\n\nDEMANDE:\n"+t.demande+"\n\nRÉSULTAT:\n"+t.result,t.tier,true);
  if(!o||!Array.isArray(o.criteres)||!o.criteres.length)return{verdict:"NON_TRANCHABLE",criteres:[],ecarts:["Réponse vérificateur illisible."]};
  const c=o.criteres.map(x=>({critere:String(x.critere||""),verdict:String(x.verdict||"").toUpperCase(),preuve:String(x.preuve||"")}));
  const v=c.some(x=>x.verdict==="NON")?"NON":c.some(x=>x.verdict!=="OUI")?"NON_TRANCHABLE":"OUI";
  const ec=(Array.isArray(o.ecarts)?o.ecarts:[]).concat(c.filter(x=>x.verdict==="NON").map(x=>x.critere));
  return{verdict:v,criteres:c,ecarts:[...new Set(ec.filter(Boolean))]}
}

async function run(t){
  t.status="en_cours";t.err="";save();render();
  try{
    if(!t.result){
      t.step="Production";
      let promptP = t.hist ? `Historique:\n${t.hist}\n\nDemande:\n${t.demande}` : t.demande;
      t.result = await ask(t,"Producteur",promptP,t.tier,false);
      save();render();
    }
    if(t.verif){
      while(t.round<3){
        t.step="Vérification ("+(t.round+1)+")";save();render();
        const v=await verifier(t);t.round++;t.v=v;
        if(v.verdict!=="NON"||t.round>=3)break;
        t.step="Correction";save();render();
        t.result=await ask(t,"Correcteur","Corrige ces écarts :\n"+v.ecarts.join("\n- ")+"\n\nRéponse précédente :\n"+t.result,t.tier,false);
        save();render();
      }
    }
    t.status="fini";
  }
  catch(e){t.status="erreur";t.err=e.message||"Erreur"}
  save();render();
}

function start(){
  const d=$("#q").value.trim();if(!d || busy)return;
  const r=route(d);
  const hist = T.filter(x=>x.id && x.result).slice(-5).map(x=>`Utilisateur: ${x.demande}\nIA: ${x.result}`).join('\n---\n');
  const t={id:Date.now(),demande:d,mode:$("#mo").value,verif:$("#vf").checked,type:r.type,tier:r.tier,status:"en_cours",round:0,hist:hist};
  T.push(t);
  $("#q").value=""; $("#q").style.height="24px";
  if(r.type==="non_supporte"){t.status="non_supporte";save();render();return}
  busy=true;
  run(t).finally(()=>{busy=false;});
}

function niveau(t){
  if(!t.verif||!t.v)return["Non vérifié","ko"];
  if(t.v.verdict==="OUI")return["Vérifié","ok"];
  if(t.v.verdict==="NON_TRANCHABLE")return["Partiel","wa"];
  return["Écart","ko"];
}

function resume(id){ const t=T.find(x=>x.id===id);if(t){busy=true;run(t).finally(()=>busy=false);} }

// Correction du mode manuel ici
function submitManual(id) {
  const t = T.find(x => x.id === id);
  const el = document.getElementById('manual-input-' + id);
  if (!t || !t._m || !el || !el.value.trim()) return;
  const val = el.value.trim();
  const m = t._m;
  t._m = null;
  t.status = "en_cours";
  m.res(val);
}

function render(){
  const chat = $("#chat");
  const isScrolledToBottom = chat.scrollHeight - chat.clientHeight <= chat.scrollTop + 100;
  let h="";
  T.forEach(t=>{
    h+='<div class="msg user"><div class="avatar">U</div><div class="bubble">'+esc(t.demande)+'</div></div>';
    
    if(t.status==="non_supporte"){
      h+='<div class="msg ai"><div class="avatar">!</div><div class="bubble" style="color:var(--ko)">Désolé, les images, vidéos et achats ne sont pas supportés.</div></div>';
    } else if(t.status==="manuel" && t._m){
      h+='<div class="msg ai"><div class="avatar">M</div><div class="bubble">';
      h+='<b>'+esc(t._m.role)+'</b><br><span style="font-size:12px;color:var(--text-muted)">Copiez ce texte dans l\'IA, puis collez sa réponse.</span>';
      h+='<textarea readonly style="width:100%;height:80px;margin:8px 0;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text)">'+esc(t._m.prompt)+'</textarea>';
      h+='<textarea id="manual-input-'+t.id+'" placeholder="Collez la réponse ici..." style="width:100%;height:60px;margin-bottom:8px;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text)"></textarea>';
      h+='<button class="icon-btn" style="width:auto;border-radius:8px;padding:0 10px;height:32px;font-size:12px" onclick="submitManual('+t.id+')">Valider la réponse</button></div></div>';
    } else if(t.status==="erreur"){
      h+='<div class="msg ai"><div class="avatar">!</div><div class="bubble"><span style="color:var(--ko)">'+esc(t.err)+'</span><br><button class="icon-btn" style="width:auto;border-radius:8px;padding:0 10px;height:32px;font-size:12px;margin-top:8px" onclick="resume('+t.id+')">Réessayer</button></div></div>';
    } else if(t.status==="en_cours" || t.result) {
      h+='<div class="msg ai"><div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><circle cx="19" cy="5" r="2"></circle><circle cx="5" cy="19" r="2"></circle><path d="M14.5 10.5L17.5 7M9.5 13.5L6.5 17M9.5 10.5L6.5 7M14.5 13.5L17.5 17"></path></svg></div><div class="bubble">';
      if(t.status==="en_cours" && !t.result) {
        h+='<div style="display:flex;gap:4px;align-items:center;height:24px"><div class="dot" style="width:6px;height:6px;background:var(--text-muted);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both"></div><div class="dot" style="width:6px;height:6px;background:var(--text-muted);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both;animation-delay:0.2s"></div><div class="dot" style="width:6px;height:6px;background:var(--text-muted);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both;animation-delay:0.4s"></div></div>';
      } else {
        h+='<pre>'+esc(t.result || "")+'</pre>';
      }
      if(t.verif && t.v){
        const n = niveau(t);
        h+='<div class="verif"><span class="badge '+n[1]+'">'+n[0]+'</span>';
        if(t.v.ecarts && t.v.ecarts.length) h+='<div style="color:var(--ko);font-size:12px;margin-top:4px">⚠️ '+t.v.ecarts.map(esc).join(" ; ")+'</div>';
        if(t.log && t.log.length){
          h+='<details class="verif-details"><summary>Détail du circuit</summary>'+t.log.map(l=>'<p>'+(l.criteres||[]).map(c=>'<b>'+esc(c.verdict)+'</b> : '+esc(c.critere)).join("<br>")+'</p>').join("")+'</details>';
        }
        h+='</div>';
      }
      h+='</div></div>';
    }
  });
  chat.innerHTML = h;
  if(isScrolledToBottom) chat.scrollTop = chat.scrollHeight;
}

$("#q").addEventListener("input", function() { this.style.height = '24px'; this.style.height = (this.scrollHeight) + 'px'; });
$("#q").addEventListener("keydown", function(e) { if(e.key === "Enter" && !e.shiftKey) { e.preventDefault(); start(); } });

load(); render(); fillS(); toggleSettings();
</script>
